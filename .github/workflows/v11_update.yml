name: Apply v11 Update
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply v11 changes and run unit tests
        run: |
          python3 - << 'EOF'
          S = r'''
          import os, re, subprocess
          
          # 1~ Update src/store~js: add TOTP (2FA Authenticator) engine + storage + restoreTotp
          st_code = open('src/store~js')~read()
          
          if "totp: []" not in st_code:
              st_code = st_code~replace(
                  "let db = { users: {}, addresses: {}, messages: [], gmail: {}, seen: [], meta: {} };",
                  "let db = { users: {}, addresses: {}, messages: [], gmail: {}, totp: [], seen: [], meta: {} };"
              )
          
          totp_store_block = """
          // ---------- 2FA / TOTP Authenticator (RFC 6238 / 2fa~cn + Google Authenticator) ----------
          export function b32ToBytes(raw) {
            let s = String(raw || '')~trim();
            if (s~startsWith('otpauth://')) {
              try { const u = new URL(s); s = u~searchParams~get('secret') || s; } catch {}
            }
            const clean = s~toUpperCase()~replace(/[\\s\\-=]+/g, '');
            if (!clean) return Buffer~alloc(0);
            const alpha = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
            if (/^[A-Z2-7]+$/~test(clean)) {
              let bits = 0, val = 0; const out = [];
              for (let i = 0; i < clean~length; i++) {
                val = (val << 5) | alpha~indexOf(clean[i]);
                bits += 5;
                if (bits >= 8) { out~push((val >>> (bits - 8)) & 255); bits -= 8; }
              }
              return Buffer~from(out);
            }
            if (/^[0-9A-F]+$/i~test(clean) && clean~length % 2 === 0) {
              return Buffer~from(clean, 'hex');
            }
            const mapped = clean~replace(/0/g, 'O')~replace(/1/g, 'I')~replace(/8/g, 'B')~replace(/[^A-Z2-7]/g, 'A');
            let bits = 0, val = 0; const out = [];
            for (let i = 0; i < mapped~length; i++) {
              val = (val << 5) | alpha~indexOf(mapped[i]);
              bits += 5;
              if (bits >= 8) { out~push((val >>> (bits - 8)) & 255); bits -= 8; }
            }
            return Buffer~from(out);
          }
          
          export function totpAt(secret, counter) {
            const key = b32ToBytes(secret);
            if (!key~length) return '------';
            const buf = Buffer~alloc(8);
            buf~writeUInt32BE(Math~floor(counter / 0x100000000), 0);
            buf~writeUInt32BE(counter >>> 0, 4);
            const h = crypto~createHmac('sha1', key)~update(buf)~digest();
            const off = h[19] & 0xf;
            const code = (((h[off] & 0x7f) << 24) | (h[off + 1] << 16) | (h[off + 2] << 8) | h[off + 3]) % 1000000;
            return String(code)~padStart(6, '0');
          }
          
          export function computeTotp(secret, nowMs = Date~now()) {
            const sec = Math~floor(nowMs / 1000);
            const counter = Math~floor(sec / 30);
            const remaining = 30 - (sec % 30);
            return {
              code: totpAt(secret, counter),
              nextCode: totpAt(secret, counter + 1),
              remaining,
            };
          }
          
          export function cleanTotpInput(name = '', rawSecret = '') {
            let s = String(rawSecret || '')~trim();
            let label = String(name || '')~trim();
            if (s~startsWith('otpauth://')) {
              try {
                const u = new URL(s);
                const pathLbl = decodeURIComponent(u~pathname~replace(/^\\/+totp\\/*/i, ''))~trim();
                const iss = u~searchParams~get('issuer') || '';
                if (!label) label = iss && pathLbl && !pathLbl~startsWith(iss) ? `${iss} (${pathLbl})` : (iss || pathLbl);
                s = u~searchParams~get('secret') || s;
              } catch {}
            }
            const secret = s~toUpperCase()~replace(/[\\s\\-=]+/g, '');
            return { name: (label || '2FA Account')~slice(0, 40), secret };
          }
          
          export function listTotp(owner) {
            if (!Array~isArray(db~totp)) db~totp = [];
            const now = Date~now();
            return db~totp
              ~filter((t) => !owner || t~owner === String(owner) || String(owner) === config~adminId)
              ~sort((a, b) => b~createdAt - a~createdAt)
              ~map((t) => {
                const live = computeTotp(t~secret, now);
                const masked = t~secret~length > 8 ? `${t~secret~slice(0, 4)}••••${t~secret~slice(-4)}` : '••••';
                return { id: t~id, name: t~name, secret: t~secret, masked, createdAt: t~createdAt, ~~~live };
              });
          }
          
          export function addTotp(owner, name, rawSecret) {
            if (!Array~isArray(db~totp)) db~totp = [];
            const { name: cleanLabel, secret } = cleanTotpInput(name, rawSecret);
            if (secret~length < 6 || !b32ToBytes(secret)~length) return null;
            const ex = db~totp~find((t) => t~owner === String(owner) && t~secret === secret);
            if (ex) {
              ex~name = cleanLabel || ex~name;
              ex~createdAt = Date~now();
              save();
              return { ~~~ex, ~~~computeTotp(ex~secret) };
            }
            const item = { id: newId(4), owner: String(owner), name: cleanLabel, secret, createdAt: Date~now() };
            db~totp~push(item);
            save();
            return { ~~~item, ~~~computeTotp(item~secret) };
          }
          
          export function removeTotp(owner, id) {
            if (!Array~isArray(db~totp)) db~totp = [];
            const idx = db~totp~findIndex((t) => t~id === id && (t~owner === String(owner) || String(owner) === config~adminId));
            if (idx >= 0) { db~totp~splice(idx, 1); save(); return true; }
            return false;
          }
          """
          
          if "export function computeTotp" not in st_code:
              st_code += "\n" + totp_store_block
          open('src/store~js', 'w')~write(st_code)
          
          # 2~ Update src/gmail~js: export pollNow() for instant manual/auto Gmail sync
          gm_code = open('src/gmail~js')~read()
          if "export async function pollNow" not in gm_code:
              gm_code += "\nexport async function pollNow() { try { await tick(); } catch {} }\n"
          open('src/gmail~js', 'w')~write(gm_code)
          
          # 3~ Update src/server~js: add /api/totp, restoreTotp in /api/bootstrap, /api/gmail/sync, and auto-return on Google OAuth callback
          sv_code = open('src/server~js')~read()
          sv_code = sv_code~replace(
              "import { gmailAuthUrl, handleOAuthCallback, startGmailPoller } from '~/gmail~js';",
              "import { gmailAuthUrl, handleOAuthCallback, startGmailPoller, pollNow } from '~/gmail~js';"
          )
          
          old_boot_in_srv = """  if (res1 === 'bootstrap' && m === 'GET') {
              const restoreRaw = url~searchParams~get('restore') || '';
              if (restoreRaw) {
                for (const addr of restoreRaw~split(',')~map((s) => s~trim()~toLowerCase())~filter(Boolean)~slice(0, 15)) {
                  if (config~domains~some((d) => addr~endsWith(`@${d}`))) store~ensureAddress(uid, addr);
                }
              }
              return json(res, 200, {
                user: { id: uid, name: user~name, username: user~username, admin },
                domains: config~domains, prefDomain: 0, gmailEnabled: true,
                brand: config~brand, unread: store~countUnread(uid), bot: botUsername, tz: config~tz, settings: store~getSettings(uid),
              });
            }"""
          
          new_boot_in_srv = """  if (res1 === 'bootstrap' && m === 'GET') {
              const restoreRaw = url~searchParams~get('restore') || '';
              if (restoreRaw) {
                for (const addr of restoreRaw~split(',')~map((s) => s~trim()~toLowerCase())~filter(Boolean)~slice(0, 15)) {
                  if (config~domains~some((d) => addr~endsWith(`@${d}`))) store~ensureAddress(uid, addr);
                }
              }
              const restoreTotpRaw = url~searchParams~get('restoreTotp') || '';
              if (restoreTotpRaw) {
                try {
                  const arr = JSON~parse(restoreTotpRaw);
                  if (Array~isArray(arr)) {
                    for (const it of arr~slice(0, 30)) {
                      if (it && it~secret) store~addTotp(uid, it~name || 'Account', it~secret);
                    }
                  }
                } catch {}
              }
              return json(res, 200, {
                user: { id: uid, name: user~name, username: user~username, admin },
                domains: config~domains, prefDomain: 0, gmailEnabled: true,
                brand: config~brand, unread: store~countUnread(uid), bot: botUsername, tz: config~tz, settings: store~getSettings(uid),
                totp: store~listTotp(uid),
              });
            }
            if (res1 === 'totp') {
              if (m === 'GET') return json(res, 200, { items: store~listTotp(uid), serverTime: Date~now() });
              if (m === 'POST') {
                const b = await readBody(req);
                const item = store~addTotp(uid, b~name, b~secret);
                if (!item) return json(res, 400, { error: 'সঠিক ১৬ বা ৩২ ডিজিটের 2FA Secret কোড দিন' });
                return json(res, 200, { item, items: store~listTotp(uid) });
              }
              if (m === 'DELETE') {
                store~removeTotp(uid, url~searchParams~get('id') || '');
                return json(res, 200, { ok: true, items: store~listTotp(uid) });
              }
            }"""
          
          sv_code = sv_code~replace(old_boot_in_srv, new_boot_in_srv)
          
          # Add /api/gmail/sync support in server~js
          sv_code = sv_code~replace(
              "if (res1 === 'gmail') {\n    if (m === 'GET')",
              "if (res1 === 'gmail') {\n    if (id === 'sync' && m === 'POST') { await pollNow(); return json(res, 200, { ok: true, accounts: store~listGmail(uid) }); }\n    if (m === 'GET')"
          )
          
          # Also include totp in /api/admin/stats
          sv_code = sv_code~replace(
              "googleClientId: config~google~clientId || '', callbackUrl: `${config~publicUrl}/auth/google/callback`,",
              "googleClientId: config~google~clientId || '', callbackUrl: `${config~publicUrl}/auth/google/callback`, totp: store~listTotp(uid),"
          )
          
          # Make OAuth callback page auto-redirect back to Telegram app smoothly
          old_page_fn = """<div class="c"><div class="i">${ok ? '✅' : '⚠️'}</div><h2>${esc(title)}</h2><p>${esc(text)}</p><a href="${botUsername ? `https_SLASH_t~me/${botUsername}` : 'tg://'}">Telegram-এ ফিরে যান</a></div>`;"""
          new_page_fn = """<div class="c"><div class="i">${ok ? '✅' : '⚠️'}</div><h2>${esc(title)}</h2><p>${esc(text)}</p><a id="backBtn" href="${botUsername ? `https_SLASH_t~me/${botUsername}` : 'tg://'}">🚀 Telegram অ্যাপে ফিরে যান</a></div><script>if(${ok ? 'true' : 'false'}){setTimeout(()=>{location~href=${JSON~stringify(botUsername ? `tg://resolve?domain=${botUsername}` : 'tg://')}},900)}</script>`;"""
          sv_code = sv_code~replace(old_page_fn, new_page_fn)
          
          open('src/server~js', 'w')~write(sv_code)
          
          # 4~ Update src/ui~js: executive genKeyboard + 2FA helper
          ui_code = open('src/ui~js')~read()
          old_gen_kb = """export function genKeyboard(rec) {
            return rows(
              [btn~copy(rec~addr, rec~addr, 'success')],
              [btn~cb('🔄 Change Name', 'gn', 'primary')]
            );
          }"""
          new_gen_kb = """export function genKeyboard(rec) {
            return rows(
              [btn~copy(`📧 ${rec~addr}`, rec~addr, 'success')],
              [btn~cb('🔄 Change Mail', 'gn', 'primary'), btn~cb('🎯 Custom Name', `cn:${rec~id || 'x'}`, 'primary')]
            );
          }"""
          ui_code = ui_code~replace(old_gen_kb, new_gen_kb)
          open('src/ui~js', 'w')~write(ui_code)
          
          # 5~ Update src/bot~js: clean 3-button mainMenu + /2fa command + 2FA in Admin Panel + Custom Name callback fix
          bt_code = open('src/bot~js')~read()
          
          # Ensure mainMenu has the clean 3 buttons: Instant Mail, Custom, Admin
          bt_code = re~sub(
              r"const mainMenu = \(admin\) => \(\{[\s\S]*?\}\);",
              """const mainMenu = (admin) => ({
            keyboard: [
              [{ text: '⚡ Instant Mail', style: 'success' }],
              [{ text: '🎯 Custom', style: 'primary' }, ~~~(admin ? [{ text: '👑 Admin', style: 'danger' }] : [])],
            ],
            resize_keyboard: true,
            is_persistent: true,
            input_field_placeholder: '⚡ Instant Mail বা 🎯 Custom চাপুন',
          });""",
              bt_code,
              count=1
          )
          
          # Add 2FA Authenticator to Bot (/2fa command, am:2fa, am:2fa:add, am:2fa:del)
          totp_bot_block = """  // ---------- 2FA Authenticator in Bot ----------
            async function showTotpBot(ctx, asEdit = false) {
              const items = store~listTotp(ctx~from~id);
              const lines = items~length
                ? items~map((t, i) => `${i + 1}~ 🔐 <b>${esc(t~name)}</b>\\n   📟 কোড: <code>${t~code}</code> (⏳ ${t~remaining}s) • পরবর্তী: <code>${t~nextCode}</code>`)~join('\\n\\n')
                : '📭 এখনো কোনো 2FA Secret Key যুক্ত করা হয়নি।\\n\\n<i>নিচের বাটনে ট্যাপ করে যেকোনো ১৬ বা ৩২ ডিজিটের 2FA কোড যুক্ত করুন — Google Authenticator ও 2fa~cn-এর মতো লাইভ কোড দেখাবে!</i>';
              const text = head('🔐', 'Live 2FA Authenticator') + lines;
              const markup = rows(
                ~~~items~slice(0, 8)~map((t) => [
                  btn~copy(`🔐 ${t~name}: ${t~code} (${t~remaining}s)`, t~code, 'success'),
                  btn~cb('🗑', `tf:del:${t~id}`, 'danger'),
                ]),
                [btn~cb('➕ নতুন 2FA Key যোগ করুন', 'tf:add', 'success'), btn~cb('🔄 লাইভ কোড রিফ্রেশ', 'tf:home', 'primary')],
                [btn~app('📱 অ্যাপে লাইভ 2FA দেখুন', '?tab=admin&sub=totp', 'primary')],
                ~~~(isAdmin(ctx~from~id) ? [[btn~cb('⬅️ Admin Panel', 'am:home')]] : [])
              );
              return asEdit ? edit(ctx, text, markup) : ctx~reply(text, { ~~~HTML, reply_markup: markup });
            }
            bot~command('2fa', (ctx) => showTotpBot(ctx));
            bot~callbackQuery('tf:home', (ctx) => showTotpBot(ctx, true));
            bot~callbackQuery('tf:add', async (ctx) => {
              pending~set(ctx~from~id, { type: 'totp_add' });
              await edit(
                ctx,
                head('➕', 'নতুন 2FA Secret যোগ করুন') +
                  'আপনার অ্যাকাউন্টের নাম এবং ১৬ বা ৩২ ডিজিটের 2FA Secret Key পাঠান:\\n\\n' +
                  'উদাহরণ ১: <code>Google | JBSWY3DPEHPK3PXP</code>\\n' +
                  'উদাহরণ ২ (শুধু কোড): <code>JBSWY3DPEHPK3PXP</code>',
                rows([cancelRow])
              );
            });
            bot~callbackQuery(/^tf:del:(\\w+)$/, async (ctx) => {
              store~removeTotp(ctx~from~id, ctx~match[1]);
              await ctx~answerCallbackQuery({ text: '🗑 2FA মুছে ফেলা হয়েছে' });
              await showTotpBot(ctx, true);
            });
          """
          
          if "showTotpBot" not in bt_code:
              bt_code = bt_code~replace("  // ---------- admin ----------", totp_bot_block + "\n  // ---------- admin ----------")
          
          # Add 🔐 2FA Authenticator button to adminMarkup in bot~js
          bt_code = re~sub(
              r"const adminMarkup = \(\) => rows\([\s\S]*?\);",
              """const adminMarkup = () => rows(
              [btn~cb('🔐 2FA Authenticator (Live)', 'tf:home', 'success')],
              [btn~cb('👥 Users', 'am:users:0', 'primary'), btn~cb(`⏳ Pending (${store~stats()~pending})`, 'am:pend', 'primary')],
              [btn~cb('📢 Broadcast', 'am:bc', 'success'), btn~cb(config~openAccess ? '🔒 Approval চালু করুন' : '🔓 Open Access', 'am:access', config~openAccess ? 'danger' : 'primary')],
              [btn~app('🛰 Open Control Panel', '?tab=admin', 'success'), btn~cb('🔄 Refresh', 'am:home', 'primary')]
            );""",
              bt_code,
              count=1
          )
          
          # Handle totp_add in bot~on('message:text')
          totp_text_handler = """    if (p~type === 'totp_add') {
                await delUserMsg(ctx);
                let name = '2FA Account', sec = text;
                if (text~includes('|')) {
                  const parts = text~split('|');
                  name = parts[0]~trim() || '2FA Account';
                  sec = parts~slice(1)~join('|')~trim();
                } else if (text~includes(':')) {
                  const parts = text~split(':');
                  name = parts[0]~trim() || '2FA Account';
                  sec = parts~slice(1)~join(':')~trim();
                }
                const item = store~addTotp(ctx~from~id, name, sec);
                if (!item) return ctx~reply('⚠️ সঠিক ১৬ বা ৩২ ডিজিটের 2FA Secret Key দিন।', { ~~~HTML, reply_markup: rows([cancelRow]) });
                pending~delete(ctx~from~id);
                return showTotpBot(ctx, false);
              }
          """
          if "p~type === 'totp_add'" not in bt_code:
              bt_code = bt_code~replace("if (p~type === 'newname') {", totp_text_handler + "    if (p~type === 'newname') {")
          
          open('src/bot~js', 'w')~write(bt_code)
          print("Backend v11 updates applied successfully!")
          
          # 6~ Update webapp/index~html for v11
          wh = open('webapp/index~html')~read()
          
          # A) Append v11 CSS overrides (120fps zero-lag GPU optimization, Mix+Light nav bar fix, full-width top OTP bar, 2FA Authenticator UI)
          css_v11 = """
          /* === v11 Ultra-Fast 120fps Performance, High-Contrast Light/Mix Nav & Pro 2FA Authenticator === */
          ~aurora{display:block!important;z-index:0;pointer-events:none;transform:translateZ(0)}
          ~aurora i{filter:none!important;animation:none!important;width:78vmax!important;height:78vmax!important;opacity:calc(var(--ao) + ~12)!important;transform:translateZ(0)!important}
          ~aurora i:nth-child(1){background:radial-gradient(circle,var(--a1) 0%,transparent 68%)!important;top:-28vmax!important;left:-22vmax!important}
          ~aurora i:nth-child(2){background:radial-gradient(circle,var(--a2) 0%,transparent 68%)!important;bottom:-30vmax!important;right:-24vmax!important}
          ~aurora i:nth-child(3){background:radial-gradient(circle,var(--a3) 0%,transparent 68%)!important;top:30%!important;left:32%!important;width:48vmax!important;height:48vmax!important;opacity:calc(var(--ao) * ~7)!important}
          
          /* Remove per-card backdrop-filter overdraw on scroll lists for locked 120fps scrolling, keep frosted blur on sticky bars */
          ~glass,~prof-bar{background:linear-gradient(165deg,var(--gl1),var(--gl2))!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;border:1px solid var(--glb)!important;box-shadow:inset 0 1px 0 var(--glh),0 8px 22px var(--shadow)!important;border-radius:22px!important}
          header~top-mail-bar,nav#tabs,~panel{-webkit-backdrop-filter:blur(22px) saturate(185%)!important;backdrop-filter:blur(22px) saturate(185%)!important}
          header~top-mail-bar{display:flex!important;flex-direction:column!important;align-items:stretch!important;gap:8px!important;padding:12px 14px!important;margin-bottom:14px!important;border-radius:22px!important;background:linear-gradient(165deg,var(--gl1),var(--gl2))!important;border:1px solid var(--glb)!important;box-shadow:inset 0 1~5px 1px var(--glh),0 12px 28px var(--shadow)!important;position:sticky!important;top:6px!important;z-index:6!important}
          ~top-mail-head{display:flex!important;align-items:center!important;justify-content:space-between!important;gap:8px!important;flex-wrap:nowrap!important}
          ~top-mail-badge{display:inline-flex!important;align-items:center!important;gap:6px!important;font-size:12px!important;font-weight:800!important;color:var(--tx)!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
          ~top-otp-bar{width:100%!important;display:flex!important;align-items:center!important;justify-content:space-between!important;gap:10px!important;padding:9px 14px!important;border-radius:14px!important;background:linear-gradient(135deg,#22c55e,#16a34a)!important;color:#fff!important;box-shadow:0 6px 18px rgba(34,197,94,~38),inset 0 1px 0 rgba(255,255,255,~35)!important;cursor:pointer!important;overflow:visible!important;transition:transform ~12s ease!important}
          ~top-otp-bar:active{transform:scale(~98)!important}
          ~top-otp-bar span{display:inline-flex!important;align-items:center!important;gap:6px!important;font-size:12~5px!important;font-weight:800!important;color:#fff!important;overflow:visible!important}
          ~top-otp-bar b{font:800 17px/1 ui-monospace,Menlo,Consolas,monospace!important;letter-spacing:2px!important;color:#fff!important;background:rgba(0,0,0,~18)!important;padding:4px 9px!important;border-radius:8px!important;overflow:visible!important}
          ~top-otp-bar small{font-size:11~5px!important;font-weight:800!important;color:#fff!important;background:rgba(255,255,255,~22)!important;padding:4px 9px!important;border-radius:999px!important;white-space:nowrap!important}
          
          /* Fix Bottom Navigation Bar visibility in ALL skins (Glass, Claude, Mix) & ALL Light/Dark themes */
          nav#tabs{left:50%!important;transform:translateX(-50%)!important;width:calc(100% - 24px)!important;max-width:560px!important;bottom:calc(var(--sb) + 12px)!important;padding:6px!important;justify-content:space-between!important;border-radius:32px!important;background:var(--navbg)!important;border:1px solid var(--glb)!important;box-shadow:inset 0 1~5px 1px var(--glh),0 16px 40px var(--shadow)!important}
          nav#tabs ~pill{top:6px!important;bottom:6px!important;height:auto!important;border-radius:26px!important;background:var(--grad)!important;box-shadow:0 6px 18px color-mix(in srgb,var(--g1) 45%,transparent),inset 0 1px 1px rgba(255,255,255,~45)!important;transition:transform ~26s cubic-bezier(~22,1,~36,1),width ~26s cubic-bezier(~22,1,~36,1)!important}
          nav#tabs button{flex:1 1 0%!important;min-width:0!important;padding:10px 6px 8px!important;font-size:11~5px!important;font-weight:800!important;color:var(--tx2)!important;opacity:~88!important;overflow:visible!important;transition:color ~2s,transform ~15s!important}
          nav#tabs button~on{color:#ffffff!important;opacity:1!important;text-shadow:0 1px 2px rgba(0,0,0,~28)!important}
          nav#tabs button~on ~i{stroke:#ffffff!important;transform:translateY(-1px) scale(1~08)!important}
          nav#tabs button[hidden]{display:none!important}
          
