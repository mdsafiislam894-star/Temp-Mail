name: Apply v10 Update
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply v10 changes and run unit tests
        run: |
          python3 - << 'EOF'
          S = r'''
          import os, re, subprocess
          
          # 1~ Update index~js: add uncaughtException protection + resilient startBot so Render never exits with status 1
          idx_code = """import { config } from '~/src/config~js';
          import * as store from '~/src/store~js';
          import { createBot, startBot } from '~/src/bot~js';
          import { startServer, setBotUsername } from '~/src/server~js';
          import { startTitan } from '~/src/titan~js';
          import { startGmailPoller } from '~/src/gmail~js';
          
          process~on('uncaughtException', (e) => console~error('⚠️ uncaughtException:', e?~message || e));
          process~on('unhandledRejection', (e) => console~error('⚠️ unhandledRejection:', e?~message || e));
          
          console~log(`🚀 ${config~brand} v10 starting~~~`);
          
          if (!config~token) { console~error('❌ TELEGRAM_BOT_TOKEN পাওয়া যায়নি!'); process~exit(1); }
          if (!config~adminId) console~warn('⚠️ TELEGRAM_CHAT_ID সেট নেই — কেউ অ্যাডমিন হতে পারবে না!');
          
          const server = startServer();
          const bot = createBot();
          startTitan();
          startGmailPoller();
          
          startBot(bot)~then((me) => {
            if (me?~username) setBotUsername(me~username);
          })~catch((e) => console~error('⚠️ Bot init warning:', e?~message || e));
          
          const shutdown = async (sig) => {
            console~log(`\\n${sig} — shutting down`);
            store~flush();
            try { await bot~stop(); } catch {}
            server~close();
            process~exit(0);
          };
          process~on('SIGTERM', () => shutdown('SIGTERM'));
          process~on('SIGINT', () => shutdown('SIGINT'));
          """
          open('index~js', 'w')~write(idx_code)
          
          # 2~ Update src/store~js:
          # - Default theme 'aurora' + skin 'glass', one-time _v10 migration to glass/aurora
          # - Honor ttlMin in createAddress & generateUniqueAddress
          # - Add setPrimaryAddress(owner, id)
          st_code = open('src/store~js')~read()
          
          st_code = st_code~replace(
            "export const DEFAULT_SETTINGS = { notify: true, otpOnly: false, style: 'smart', theme: 'auto', skin: 'glass', ttl: 0, muted: [] };",
            "export const DEFAULT_SETTINGS = { notify: true, otpOnly: false, style: 'smart', theme: 'aurora', skin: 'glass', ttl: 0, muted: [] };"
          )
          
          old_get_settings = """export function getSettings(id) {
            const s = { ~~~DEFAULT_SETTINGS, ~~~(db~users[String(id)]?~settings || {}) };
            if (!STYLES~includes(s~style)) s~style = 'smart';
            if (!SKINS~includes(s~skin)) s~skin = 'glass';
            if (!Array~isArray(s~muted)) s~muted = [];
            return s;
          }"""
          
          new_get_settings = """export function getSettings(id) {
            const raw = db~users[String(id)]?~settings || {};
            if (!raw~_v10) {
              raw~skin = 'glass';
              if (!raw~theme || raw~theme === 'clay' || raw~theme === 'claydark' || raw~theme === 'auto') raw~theme = 'aurora';
              raw~_v10 = true;
              if (db~users[String(id)]) { db~users[String(id)]~settings = raw; save(); }
            }
            const s = { ~~~DEFAULT_SETTINGS, ~~~raw };
            if (!STYLES~includes(s~style)) s~style = 'smart';
            if (!SKINS~includes(s~skin)) s~skin = 'glass';
            if (!Array~isArray(s~muted)) s~muted = [];
            return s;
          }"""
          
          st_code = st_code~replace(old_get_settings, new_get_settings)
          
          old_gen_unique = """export function generateUniqueAddress(owner, customLocal = '', label = '') {
          const domain = 'safix~tech';
          const clean = String(customLocal || '')~toLowerCase()~replace(/[^a-z0-9~_-]/g, '')~slice(0, 32);
          if (clean) {
          const full = `${clean}@${domain}`;
          const ex = getAddress(full);
          if (ex) return ex~owner === String(owner) ? ex : null;
          return createAddress(owner, full, label, 0);
          }
          for (let i = 0; i < 40; i++) {
          const w = ANIME_TECH_NAMES[crypto~randomInt(ANIME_TECH_NAMES~length)];
          const r = createAddress(owner, `${w}${crypto~randomInt(100, 10000)}@${domain}`, label, 0);
          if (r) return r;
          }
          while (true) {
          seqCounter = (seqCounter + 1) % 90000 + 10000;
          const w = ANIME_TECH_NAMES[crypto~randomInt(ANIME_TECH_NAMES~length)];
          const r = createAddress(owner, `${w}${seqCounter}@${domain}`, label, 0);
          if (r) return r;
          }
          }"""
          
          new_gen_unique = """export function generateUniqueAddress(owner, customLocal = '', label = '', ttlMin = 0) {
          const domain = 'safix~tech';
          const clean = String(customLocal || '')~toLowerCase()~replace(/[^a-z0-9~_-]/g, '')~slice(0, 32);
          if (clean) {
          const full = `${clean}@${domain}`;
          const ex = getAddress(full);
          if (ex) {
            if (ex~owner === String(owner)) { ex~createdAt = Date~now(); save(); return ex; }
            return null;
          }
          return createAddress(owner, full, label, ttlMin);
          }
          for (let i = 0; i < 40; i++) {
          const w = ANIME_TECH_NAMES[crypto~randomInt(ANIME_TECH_NAMES~length)];
          const r = createAddress(owner, `${w}${crypto~randomInt(100, 10000)}@${domain}`, label, ttlMin);
          if (r) return r;
          }
          while (true) {
          seqCounter = (seqCounter + 1) % 90000 + 10000;
          const w = ANIME_TECH_NAMES[crypto~randomInt(ANIME_TECH_NAMES~length)];
          const r = createAddress(owner, `${w}${seqCounter}@${domain}`, label, ttlMin);
          if (r) return r;
          }
          }
          export function setPrimaryAddress(owner, id) {
            const a = getAddressById(id);
            if (!a || a~owner !== String(owner)) return null;
            a~createdAt = Date~now() + 1000;
            save();
            return a;
          }"""
          
          st_code = st_code~replace(old_gen_unique, new_gen_unique)
          
          old_create_addr = """export function createAddress(owner, addr, label = '', ttlMin = 0) {
            addr = addr~toLowerCase();
            if (db~addresses[addr]) return null;
            const rec = (db~addresses[addr] = {
              id: newId(3), addr, owner: String(owner), label, createdAt: Date~now(),
              ttl: 0, expiresAt: 0, expired: false,
            });
            save();
            return rec;
          }"""
          
          new_create_addr = """export function createAddress(owner, addr, label = '', ttlMin = 0) {
            addr = addr~toLowerCase();
            if (db~addresses[addr]) return null;
            const ttl = Number(ttlMin) || 0;
            const rec = (db~addresses[addr] = {
              id: newId(3), addr, owner: String(owner), label, createdAt: Date~now(),
              ttl, expiresAt: ttl > 0 ? Date~now() + ttl * 60000 : 0, expired: false,
            });
            save();
            return rec;
          }"""
          
          st_code = st_code~replace(old_create_addr, new_create_addr)
          open('src/store~js', 'w')~write(st_code)
          
          # 3~ Update src/ui~js: support smart, rich, compact styles in mailCard & mailKeyboard
          ui_code = """import { config, webappUrl } from '~/config~js';
          import { escapeHtml as esc } from '~/lib/mailparse~js';
          
          const withStyle = (b, style) => (style ? { ~~~b, style } : b);
          export const btn = {
            cb: (text, data, style) => withStyle({ text, callback_data: data }, style),
            copy: (text, value, style) => withStyle({ text, copy_text: { text: String(value)~slice(0, 256) } }, style),
            url: (text, url, style) => withStyle({ text, url }, style),
            app: (text, path = '', style) => {
              const base = webappUrl();
              return base ? withStyle({ text, web_app: { url: base + path } }, style) : null;
            },
          };
          export const rows = (~~~r) => ({ inline_keyboard: r~map((x) => (Array~isArray(x) ? x : [x])~filter(Boolean))~filter((x) => x~length) });
          export const fmtTime = (ts) => new Intl~DateTimeFormat('en-US', { timeZone: config~tz, hour: 'numeric', minute: '2-digit' })~format(new Date(ts));
          export const fmtDate = (ts) => new Intl~DateTimeFormat('en-GB', { timeZone: config~tz, day: '2-digit', month: 'short', hour: 'numeric', minute: '2-digit' })~format(new Date(ts));
          export const HR = '━━━━━━━━━━━━━━';
          export const head = (icon, title) => `${icon} <b>${esc(title)}</b>\\n${HR}\\n`;
          
          const shortLabel = (l) => {
            const t = String(l~label || '')~trim();
            return (t && t~length <= 18 ? t : l~host~split('~')~slice(-2, -1)[0] || l~host)~slice(0, 18);
          };
          export const mainLink = (msg) => {
            const ls = msg~links || [];
            return (msg~otp ? ls~filter((l) => l~score >= 3) : ls)[0] || null;
          };
          
          export function mailCard(msg, rec, style = 'smart') {
            const link = mainLink(msg);
            if (style === 'rich') {
              const codeLine = msg~otp ? `\\n🔐 <b>Code:</b> <code>${esc(msg~otp)}</code> (ট্যাপ করে কপি)` : '';
              const linkLine = link ? `\\n🔗 <b>Link:</b> ${esc(shortLabel(link))} 👇` : '';
              const subjLine = !msg~otp && !link && msg~subject ? `\\n📝 ${esc(msg~subject~slice(0, 60))}` : '';
              return `📬 <b>New Mail</b> • ${fmtTime(msg~date || Date~now())}\\n${HR}\\n👤 <b>${esc(msg~to)}</b>\\n${msg~service~icon} <b>${esc(msg~service~name)}</b> › ${esc(msg~purpose)}${codeLine}${linkLine}${subjLine}`;
            }
            if (style === 'compact') {
              const info = msg~otp ? `🔐 <b>${esc(msg~otp)}</b>` : link ? '🔗 <b>Verification Link</b>' : `📩 ${esc((msg~subject || msg~purpose || 'New Mail')~slice(0, 40))}`;
              return `${msg~service~icon} <b>${esc(msg~service~name)}</b> • <b>${esc(msg~to)}</b>\\n${info} 👇`;
            }
            let line3 = '• 📩 New Message 👇';
            if (msg~otp && link) line3 = `• 🔐 <b>Code:</b> <code>${esc(msg~otp)}</code> (ট্যাপ করে কপি) • 🔗 <b>ভেরিফিকেশন লিংক</b> 👇`;
            else if (msg~otp) line3 = `• 🔐 <b>Code:</b> <code>${esc(msg~otp)}</code> (ট্যাপ করলেই কপি) 👇`;
            else if (link) line3 = '• 🔗 Verification Link 👇';
            else if (msg~subject) line3 = `• ${esc(msg~subject~slice(0, 48))} 👇`;
            return `<b>${esc(msg~to)}</b>\\n${msg~service~icon} <b>${esc(msg~service~name)}</b> • ${esc(msg~purpose)}\\n${line3}`;
          }
          
          export function mailKeyboard(msg, { back = false, style = 'smart' } = {}) {
            const r = [];
            const first = [];
            if (msg~otp) first~push(btn~copy(`🔒 ${msg~otp}`, msg~otp, 'success'));
            const link = mainLink(msg);
            if (link) first~push(btn~url(`🔗 ${shortLabel(link)} ↗`, link~url, 'primary'));
            if (first~length) r~push(first);
            if (style === 'compact') {
              r~push([btn~cb('📄 Full Message', `fm:${msg~id}`, 'primary')]);
            } else {
              r~push([btn~cb('🔄 Change Name', 'gn', 'primary'), btn~cb('📄 Full Message', `fm:${msg~id}`, 'primary')]);
            }
            if (back) r~push([btn~cb('⬅️ Inbox', 'ib:0')]);
            return rows(~~~r);
          }
          
          export function fullMessageText(msg) {
            const body = (msg~text || '(empty)')~slice(0, 3200);
            const links = msg~links || [];
            let hl = '';
            if (msg~otp) hl += `\\n🔐 <b>Verification Code:</b> <code>${esc(msg~otp)}</code>`;
            if (links~length) {
              hl += `\\n🔗 <b>Verification Link${links~length > 1 ? 's' : ''}:</b>\\n` +
                links~slice(0, 4)~map((l) => `  • <a href="${esc(l~url)}">${esc(l~label || l~host)} ↗</a>`)~join('\\n');
            }
            return (
              `📄 <b>Full Message</b>\\n${HR}\\n` +
              `<b>To:</b> <code>${esc(msg~to)}</code>\\n<b>From:</b> ${esc(msg~from || '—')}\\n` +
              `<b>Subject:</b> ${esc(msg~subject || '(no subject)')}\\n<b>Time:</b> ${fmtDate(msg~date)}` +
              (hl ? `\\n${HR}${hl}` : '') +
              `\\n\\n<blockquote expandable>${esc(body)}${msg~text && msg~text~length > 3200 ? '\\n…' : ''}</blockquote>`
            );
          }
          
          export const fmtLeft = () => '♾';
          export function genCard() {
            return `🚀 <b>Your Instant Disposable Email:</b>\\n✨ <i>Tap the box below to copy:</i> 👇`;
          }
          export function genKeyboard(rec) {
            return rows(
              [btn~copy(rec~addr, rec~addr, 'success')],
              [btn~cb('🔄 Change Name', 'gn', 'primary')]
            );
          }
          export const SERVICE_COLORS = ['#7c5cff', '#00c2a8', '#ff6b6b', '#ffa94d', '#4dabf7', '#f06595'];
          """
          open('src/ui~js', 'w')~write(ui_code)
          
          # 4~ Update src/notify~js: pass st~style to mailCard & mailKeyboard, auto-register @safix~tech addresses on ingest, support silentNotify
          nf_code = open('src/notify~js')~read()
          nf_code = nf_code~replace(
            "await safeLiveUpdate(msg~owner, mailCard(m), mailKeyboard(m));",
            "await safeLiveUpdate(msg~owner, mailCard(m, rec, st~style), mailKeyboard(m, { style: st~style }));"
          )
          old_ingest_sig = "export async function ingest({ to, from, subject = '', text = '', html = '', messageId, date, source = 'imap', owner }) {"
          new_ingest_sig = "export async function ingest({ to, from, subject = '', text = '', html = '', messageId, date, source = 'imap', owner, silentNotify = false }) {"
          nf_code = nf_code~replace(old_ingest_sig, new_ingest_sig)
          
          old_owner_resolve = """  const rec = store~getAddress(to);
            if (rec?~expired) { store~markSeen(key); console~log(`⏳ dropped mail for expired address ${to}`); return null; }
            const ownerId = owner || rec?~owner || config~adminId;
            if (!ownerId) { console~warn('⚠️ No owner for', to, '- set TELEGRAM_CHAT_ID'); return null; }"""
          
          new_owner_resolve = """  let rec = store~getAddress(to);
            if (rec?~expired) { store~markSeen(key); console~log(`⏳ dropped mail for expired address ${to}`); return null; }
            const ownerId = owner || rec?~owner || config~adminId;
            if (!ownerId) { console~warn('⚠️ No owner for', to, '- set TELEGRAM_CHAT_ID'); return null; }
            if (!rec && to~includes('@') && config~domains~some((d) => to~endsWith(`@${d}`))) {
              rec = store~ensureAddress(ownerId, to);
            }"""
          
          nf_code = nf_code~replace(old_owner_resolve, new_owner_resolve)
          nf_code = nf_code~replace("  await notifyMessage(msg);\n  return msg;", "  if (!silentNotify) await notifyMessage(msg);\n  return msg;")
          open('src/notify~js', 'w')~write(nf_code)
          
          # 5~ Update src/titan~js: fetch both unseen AND recent 2-day messages (so already-seen or post-restart messages are never missed!)
          ti_code = """import { ImapFlow } from 'imapflow';
          import { simpleParser } from 'mailparser';
          import { config } from '~/config~js';
          import { ingest } from '~/notify~js';
          import * as store from '~/store~js';
          
          const status = new Map();
          const activeListeners = new Set();
          const initialSynced = new Set();
          export const titanStatus = () => ({
            total: config~titan~accounts~length,
            online: [~~~status~values()]~filter(Boolean)~length,
          });
          export const titanAccounts = () => config~titan~accounts~map((a) => ({ user: a~user, online: Boolean(status~get(a~user)) }));
          
          function pickRecipient(parsed, fallback) {
            const list = []
              ~concat(parsed~to || [], parsed~cc || [], parsed~bcc || [], parsed~deliveredTo || [])
              ~flatMap((t) => (Array~isArray(t?~value) ? t~value : typeof t === 'string' ? [{ address: t }] : []))
              ~map((v) => (v~address || '')~toLowerCase())
              ~filter(Boolean);
            const h = (name) => {
              const v = parsed~headers?~get(name);
              if (!v) return '';
              if (typeof v === 'string') return v~toLowerCase();
              if (v~text) return String(v~text)~toLowerCase();
              if (Array~isArray(v)) return v~map((x) => (typeof x === 'string' ? x : x?~text || ''))~join(' ')~toLowerCase();
              return '';
            };
            for (const k of ['delivered-to', 'x-original-to', 'envelope-to', 'x-envelope-to', 'x-forwarded-to', 'to', 'cc']) {
              const v = h(k);
              if (v) list~push(~~~(v~match(/[a-z0-9~_+-]+@[a-z0-9~-]+/gi) || [])~map((x) => x~toLowerCase()));
            }
            const rcv = parsed~headers?~get('received');
            const rcvList = Array~isArray(rcv) ? rcv : rcv ? [rcv] : [];
            for (const r of rcvList) {
              const s = typeof r === 'string' ? r : r?~text || '';
              const m = s~match(/for\\s+<([a-z0-9~_+-]+@[a-z0-9~-]+)>/i) || s~match(/for\\s+([a-z0-9~_+-]+@[a-z0-9~-]+)/i);
              if (m) list~push(m[1]~toLowerCase());
            }
            const known = list~find((a) => store~getAddress(a));
            if (known) return known;
            const nonCatchAll = list~find((a) => a !== String(fallback || '')~toLowerCase() && config~domains~some((d) => a~endsWith(`@${d}`)));
            if (nonCatchAll) return nonCatchAll;
            const mine = list~find((a) => config~domains~some((d) => a~endsWith(`@${d}`)));
            return mine || list[0] || fallback;
          }
          
          const failures = new Map();
          
          async function drain(client, account, isFirstRun = false) {
            const lock = await client~getMailboxLock('INBOX');
            try {
              const sinceDate = new Date(Date~now() - 2 * 86400000);
              const [unseenUids, recentUids] = await Promise~all([
                client~search({ seen: false }, { uid: true })~catch(() => []),
                client~search({ since: sinceDate }, { uid: true })~catch(() => []),
              ]);
              const combined = [~~~new Set([~~~(recentUids || [])~slice(-20), ~~~(unseenUids || [])~slice(-20)])]~sort((a, b) => a - b);
              const unseenSet = new Set(unseenUids || []);
              const todo = combined~filter((u) => !store~hasSeen(`uid:${account~user}:${u}`))~slice(-20);
              if (!todo~length) return;
              for (const uid of todo) {
                const fkey = `${account~user}:${uid}`;
                const uidKey = `uid:${account~user}:${uid}`;
                try {
                  const msg = await client~fetchOne(uid, { source: true, flags: true }, { uid: true });
                  if (msg?~source) {
                    const p = await simpleParser(msg~source);
                    const wasUnseen = unseenSet~has(uid) || !(msg~flags && msg~flags~has('\\\\Seen'));
                    await ingest({
                      to: account~host === 'imap~gmail~com' ? account~user : pickRecipient(p, account~user),
                      owner: account~owner,
                      from: p~from?~text || 'Unknown',
                      subject: p~subject || '',
                      text: p~text || '',
                      html: typeof p~html === 'string' ? p~html : '',
                      messageId: `${account~user}|${uid}|${p~messageId || ''}`,
                      date: p~date ? p~date~getTime() : Date~now(),
                      source: account~host === 'imap~gmail~com' ? 'gmail' : 'imap',
                      silentNotify: isFirstRun && !wasUnseen,
                    });
                    store~markSeen(uidKey);
                  }
                  failures~delete(fkey);
                } catch (e) {
                  const n = (failures~get(fkey) || 0) + 1;
                  failures~set(fkey, n);
                  if (n < 3) continue;
                  store~markSeen(uidKey);
                }
                await client~messageFlagsAdd(uid, ['\\\\Seen'], { uid: true })~catch(() => {});
              }
            } finally {
              lock~release();
            }
          }
          
          export function startSingleImap(account) {
            const key = account~user~toLowerCase();
            if (activeListeners~has(key)) return;
            activeListeners~add(key);
            let attempt = 0;
            const run = async () => {
              const client = new ImapFlow({
                host: account~host || config~titan~host, port: 993, secure: true,
                auth: { user: account~user, pass: account~pass }, logger: false,
              });
              let busy = false, again = false, closed = false, fails = 0, poll;
              const processMail = async () => {
                if (busy) { again = true; return; }
                busy = true;
                try {
                  do {
                    again = false;
                    const first = !initialSynced~has(key);
                    await drain(client, account, first);
                    initialSynced~add(key);
                    fails = 0;
                  } while (again);
                } catch (e) {
                  if (++fails >= 3) { try { client~close(); } catch {} }
                } finally { busy = false; }
              };
              const onClose = () => {
                if (closed) return;
                closed = true;
                clearInterval(poll);
                status~set(account~user, false);
                const wait = Math~min(30000, 2500 * 2 ** Math~min(attempt++, 4));
                setTimeout(run, wait);
              };
              client~on('error', () => {});
              client~on('close', onClose);
              client~on('exists', () => processMail());
              try {
                await client~connect();
                status~set(account~user, true);
                attempt = 0;
                console~log(`✅ [IMAP Online] ${account~user}`);
                await processMail();
                poll = setInterval(processMail, 4000);
              } catch (e) {
                try { client~close(); } catch {}
                onClose();
              }
            };
            return run();
          }
          
          export function startTitan() {
            for (const g of store~allGmail()) {
              if (g~imapPass && g~status !== 'expired') {
                startSingleImap({ user: g~email, pass: g~imapPass, host: 'imap~gmail~com', owner: g~owner });
              }
            }
            const accounts = config~titan~accounts;
            if (!accounts~length) return;
            accounts~forEach((a) => startSingleImap(a));
          }
          """
          open('src/titan~js', 'w')~write(ti_code)
          
          # 6~ Update src/bot~js: resilient polling retry on 409 Conflict + /test command
          bt_code = open('src/bot~js')~read()
          old_bot_start = "  bot~start({ drop_pending_updates: false })~catch((e) => console~error('❌ polling stopped:', e~message));"
          new_bot_start = """  const launchPolling = () => {
              bot~start({ drop_pending_updates: false })~catch((e) => {
                console~warn('⚠️ Bot polling interrupted (' + (e?~message || e) + '), retrying in 5s~~~');
                setTimeout(launchPolling, 5000);
              });
            };
            launchPolling();"""
          bt_code = bt_code~replace(old_bot_start, new_bot_start)
          open('src/bot~js', 'w')~write(bt_code)
          
          # 7~ Update src/server~js:
          # - Restore saved addresses in /api/bootstrap?restore=~~~
          # - Honor ttl in POST /api/addresses
