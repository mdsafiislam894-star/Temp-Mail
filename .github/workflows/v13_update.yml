name: Apply v13 Update
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v13 changes
        run: |
          python3 - << 'PYEOF'
          S = r'''
          import os, glob, re, subprocess
          for wf_num in ['v10', 'v11', 'v12']:
              for wf_path in sorted(glob~glob(f'~github/workflows/{wf_num}*~yml')):
                  try:
                      wf_txt = open(wf_path, 'r', encoding='utf-8')~read()
                      m = re~search(r"python3 - << 'PYEOF'\n(~*?)\n\s*PYEOF", wf_txt, re~S)
                      if m:
                          py_block = '\n'~join(line[10:] if line~startswith('          ') else line for line in m~group(1)~splitlines())
                          subprocess~run(['python3', '-c', py_block], check=False)
                  except Exception as e:
                      print('Prior wf notice:', wf_path, e)
          for old_wf in glob~glob('~github/workflows/*~yml'):
              if 'v13' not in os~path~basename(old_wf):
                  try: os~remove(old_wf)
                  except Exception: pass
          cfg_full = """import path from 'path';
          const env = process~env;
          function titanAccounts() {
          const raw = env~TITAN_ACCOUNTS || '';
          if (!raw) return env~TITAN_EMAIL && env~TITAN_PASSWORD ? [{ user: env~TITAN_EMAIL, pass: env~TITAN_PASSWORD }] : [];
          return raw~split(',')~map((item) => {
          const i = item~indexOf(':');
          return i > 0 ? { user: item~slice(0, i)~trim(), pass: item~slice(i + 1)~trim() } : null;
          })~filter(Boolean);
          }
          export const envGoogle = {
          clientId: (env~GOOGLE_CLIENT_ID || '')~trim(),
          clientSecret: (env~GOOGLE_CLIENT_SECRET || '')~trim(),
          };
          export const config = {
          token: env~TELEGRAM_BOT_TOKEN,
          adminId: String(env~TELEGRAM_CHAT_ID || '')~trim(),
          domains: ['safix~tech'],
          brand: env~BRAND_NAME || 'ARIYAN MAIL',
          publicUrl: (env~PUBLIC_URL || env~RENDER_EXTERNAL_URL || 'https_SLASH_temp-mail-pks1~onrender~com')~replace(/\\/+$/, ''),
          port: Number(env~PORT) || 3000,
          dataDir: path~resolve(env~DATA_DIR || '~/data'),
          tz: env~TZ_NAME || 'Asia/Dhaka',
          openAccess: env~OPEN_ACCESS ? env~OPEN_ACCESS === 'true' : true,
          inboundSecret: env~INBOUND_SECRET || '',
          retentionDays: Number(env~RETENTION_DAYS) || 7,
          maxPerUser: Number(env~MAX_MESSAGES_PER_USER) || 150,
          google: {
          clientId: envGoogle~clientId,
          clientSecret: envGoogle~clientSecret,
          pollMs: Math~max(2500, Number(env~GMAIL_POLL_MS) || 3500),
          },
          titan: { accounts: titanAccounts(), host: env~TITAN_IMAP_HOST || 'imap~titan~email' },
          };
          export function setGoogleCreds(id, secret) {
          if (id !== undefined && String(id)~trim()) config~google~clientId = String(id)~trim();
          if (secret !== undefined && String(secret)~trim()) config~google~clientSecret = String(secret)~trim();
          }
          export const webappUrl = () => (config~publicUrl~startsWith('https_SLASH_') ? `${config~publicUrl}/app?v=13` : '');
          export const gmailEnabled = () => Boolean(config~google~clientId && config~google~clientSecret && config~publicUrl~startsWith('https_SLASH_'));"""
          open('src/config~js', 'w')~write(cfg_full)
          gmail_full = """import { simpleParser } from 'mailparser';
          import { ImapFlow } from 'imapflow';
          import { config, envGoogle } from '~/config~js';
          import * as store from '~/store~js';
          import { signToken, verifyToken } from '~/auth~js';
          import { ingest, safeSend } from '~/notify~js';
          import { btn, rows } from '~/ui~js';
          const SCOPE = 'openid email https_SLASH_mail~google~com/ https_SLASH_www~googleapis~com/auth/gmail~readonly';
          const redirectUri = () => `${config~publicUrl}/auth/google/callback`;
          const initialPolled = new Set(), apiAlertSent = new Set(), xoauthListeners = new Set();
          const cache = new Map();
          export const clearGmailTokenCache = () => cache~clear();
          export function gmailAuthUrl(uid, loginHint = '', forceLogin = false) {
          const params = {
          client_id: config~google~clientId,
          redirect_uri: redirectUri(),
          response_type: 'code',
          scope: SCOPE,
          access_type: 'offline',
          prompt: forceLogin ? 'login consent' : 'select_account consent',
          include_granted_scopes: 'true',
          state: signToken({ uid: String(uid), cid: config~google~clientId }, 1800),
          };
          if (loginHint && loginHint~includes('@')) params~login_hint = loginHint~trim();
          return `https_SLASH_accounts~google~com/o/oauth2/v2/auth?${new URLSearchParams(params)}`;
          }
          function getCredPairs(acc = null) {
          const pairs = [];
          const add = (id, sec) => { if (id && sec && !pairs~some((p) => p~id === id && p~sec === sec)) pairs~push({ id, sec }); };
          if (acc?~clientId && acc?~clientSecret) add(acc~clientId, acc~clientSecret);
          add(config~google~clientId, config~google~clientSecret);
          const saved = store~getMeta('googleCreds');
          if (saved?~id && saved?~secret) add(saved~id, saved~secret);
          add(envGoogle~clientId, envGoogle~clientSecret);
          return pairs;
          }
          async function tokenRequest(params, acc = null) {
          const pairs = getCredPairs(acc);
          let lastErr = new Error('Google OAuth Client ID/Secret সেট করা নেই');
          for (const p of pairs) {
          const res = await fetch('https_SLASH_oauth2~googleapis~com/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ client_id: p~id, client_secret: p~sec, ~~~params }),
          });
          const data = await res~json()~catch(() => ({}));
          if (res~ok && data~access_token) return { ~~~data, usedClientId: p~id, usedClientSecret: p~sec };
          const e = new Error(data~error_description || data~error || `HTTP ${res~status}`);
          e~code = data~error; lastErr = e;
          }
          throw lastErr;
          }
          const decodeJwt = (jwt = '') => {
          try { return JSON~parse(Buffer~from(jwt~split('~')[1] || 'e30', 'base64url')~toString()); } catch { return {}; }
          };
          export async function handleOAuthCallback(code, state, error) {
          if (error) return { ok: false, message: error === 'access_denied' ? 'আপনি অনুমতি দেননি।' : error };
          const st = verifyToken(state);
          if (!st || !code) return { ok: false, message: 'লিংকের মেয়াদ শেষ বা অবৈধ। আবার চেষ্টা করুন।' };
          try {
          const t = await tokenRequest({ code, grant_type: 'authorization_code', redirect_uri: redirectUri() });
          let email = String(decodeJwt(t~id_token)~email || '')~toLowerCase();
          if (!email && t~access_token) {
          const uRes = await fetch('https_SLASH_www~googleapis~com/oauth2/v2/userinfo', { headers: { Authorization: `Bearer ${t~access_token}` } })~catch(() => null);
          if (uRes && uRes~ok) email = String((await uRes~json()~catch(() => ({})))~email || '')~toLowerCase();
          }
          if (!email) throw new Error('Google থেকে ইমেইল ঠিকানা পাওয়া যায়নি');
          const prev = store~allGmail()~find((g) => g~email === email);
          const refreshToken = t~refresh_token || prev?~refreshToken;
          if (!refreshToken) throw new Error('refresh token পাওয়া যায়নি — আবার Continue with Gmail চাপুন।');
          const rec = store~upsertGmail({
          email, owner: st~uid, refreshToken,
          clientId: t~usedClientId || config~google~clientId,
          clientSecret: t~usedClientSecret || config~google~clientSecret,
          status: 'active', lastError: '', connectedAt: Date~now(),
          });
          cache~set(email, { token: t~access_token, exp: Date~now() + (Number(t~expires_in || 3500) - 60) * 1000 });
          startGmailPoller();
          pollAccount(rec)~catch(() => {});
          await safeSend(st~uid, `✅ <b>Gmail সফলভাবে যুক্ত হয়েছে!</b>\\n📧 <code>${email}</code>\\nএখন থেকে এই ইনবক্সের সব OTP ও ভেরিফিকেশন লিংক সাথে সাথে এখানে আসবে।`, undefined);
          return { ok: true, email };
          } catch (e) {
          return { ok: false, message: e~message };
          }
          }
          async function accessToken(acc) {
          const c = cache~get(acc~email);
          if (c && c~exp > Date~now()) return c~token;
          const t = await tokenRequest({ refresh_token: acc~refreshToken, grant_type: 'refresh_token' }, acc);
          if (t~usedClientId && (acc~clientId !== t~usedClientId || acc~clientSecret !== t~usedClientSecret)) {
          store~upsertGmail({ email: acc~email, clientId: t~usedClientId, clientSecret: t~usedClientSecret, status: 'active' });
          }
          cache~set(acc~email, { token: t~access_token, exp: Date~now() + (Number(t~expires_in || 3500) - 60) * 1000 });
          return t~access_token;
          }
          async function gget(acc, path, retry = true) {
          const tok = await accessToken(acc);
          const res = await fetch(`https_SLASH_gmail~googleapis~com/gmail/v1/users/me/${path}`, { headers: { Authorization: `Bearer ${tok}` } });
          if (res~status === 401 && retry) { cache~delete(acc~email); return gget(acc, path, false); }
          if (!res~ok) {
          const errBody = await res~json()~catch(() => ({}));
          const e = new Error(errBody?~error?~message || `Gmail API ${res~status}`);
          e~status = res~status; throw e;
          }
          return res~json();
          }
          async function pollViaXoauthImap(acc) {
          const tok = await accessToken(acc);
          const client = new ImapFlow({ host: 'imap~gmail~com', port: 993, secure: true, auth: { user: acc~email, accessToken: tok }, logger: false });
          try {
          await client~connect();
          const lock = await client~getMailboxLock('INBOX');
          try {
          const uids = (await client~search({ since: new Date(Date~now() - 2 * 86400000) }, { uid: true })~catch(() => [])) || [];
          const isFirst = !initialPolled~has(acc~email);
          for (const uid of uids~filter((u) => !store~hasSeen(`gmuid:${acc~email}:${uid}`))~slice(-15)) {
          const msg = await client~fetchOne(uid, { source: true }, { uid: true })~catch(() => null);
          if (msg?~source) {
          const p = await simpleParser(msg~source);
          const msgDate = p~date ? p~date~getTime() : Date~now();
          await ingest({
          to: acc~email, owner: acc~owner, source: 'gmail', messageId: `${acc~email}:imap:${uid}`,
          from: p~from?~text || 'Unknown', subject: p~subject || '', text: p~text || '',
          html: typeof p~html === 'string' ? p~html : '', date: msgDate, silentNotify: isFirst && (Date~now() - msgDate > 600000),
          });
          store~markSeen(`gmuid:${acc~email}:${uid}`);
          }
          }
          initialPolled~add(acc~email);
          if (acc~lastError) store~upsertGmail({ email: acc~email, status: 'active', lastError: '' });
          } finally { lock~release(); }
          await client~logout()~catch(() => {});
          return true;
          } catch { try { client~close(); } catch {} return false; }
          }
          async function pollAccount(acc) {
          if (!acc~refreshToken) return;
          const isFirst = !initialPolled~has(acc~email);
          try {
          const list = await gget(acc, `messages?q=${encodeURIComponent('newer_than:2d -from:me')}&maxResults=15`);
          for (const id of (list~messages || [])~map((m) => m~id)~reverse()) {
          const key = `gmail:${acc~email}:${id}`;
          if (store~hasSeen(key)) continue;
          const full = await gget(acc, `messages/${id}?format=raw`);
          const msgDate = Number(full~internalDate) || Date~now();
          const p = await simpleParser(Buffer~from(full~raw, 'base64url'));
          await ingest({
          to: acc~email, owner: acc~owner, source: 'gmail', messageId: `${acc~email}:${id}`,
          from: p~from?~text || 'Unknown', subject: p~subject || '', text: p~text || '',
          html: typeof p~html === 'string' ? p~html : '', date: msgDate, silentNotify: isFirst && (Date~now() - msgDate > 600000),
          });
          }
          initialPolled~add(acc~email);
          if (acc~lastError || acc~status !== 'active') store~upsertGmail({ email: acc~email, status: 'active', lastError: '' });
          } catch (e) {
          if (await pollViaXoauthImap(acc)) return;
          if (e~status === 403 && /gmail\\~googleapis\\~com|has not been used|disabled/i~test(e~message || '')) {
          const urlMatch = (e~message || '')~match(/https:\\/\\/console\\~developers\\~google\\~com[^\\s"']+/);
          const enableUrl = urlMatch ? urlMatch[0] : 'https_SLASH_console~cloud~google~com/apis/library/gmail~googleapis~com';
          store~upsertGmail({ email: acc~email, lastError: 'Google Cloud প্রজেক্টে Gmail API Enable করা নেই' });
          const alertKey = `${acc~owner}:${config~google~clientId}`;
          if (!apiAlertSent~has(alertKey)) {
          apiAlertSent~add(alertKey);
          await safeSend(acc~owner, `⚠️ <b>Gmail API चालू করুন (১ ক্লিকে)</b>\\nআপনার নতুন Google Cloud প্রজেক্টে <b>Gmail API</b> এখনো Enable করা হয়নি। নিচের বাটনে ট্যাপ করে <b>Enable</b> চাপলেই মেইল আসা শুরু হবে:`, rows([btn~url('⚡ ১ ক্লিকে Gmail API Enable করুন ↗', enableUrl, 'success')]))~catch(() => {});
          }
          return;
          }
          throw e;
          }
          }
          let running = false, pollerOn = false;
          async function tick() {
          if (running) return;
          running = true;
          try {
          for (const acc of store~allGmail()~filter((g) => g~refreshToken)) {
          try { await pollAccount(acc); } catch (e) {
          if (e~code === 'invalid_grant') store~upsertGmail({ email: acc~email, status: 'expired', lastError: 'টোকেনের মেয়াদ শেষ — আবার কানেক্ট করুন' });
          }
          }
          } finally { running = false; }
          }
          export function startGmailPoller() {
          if (!pollerOn) { pollerOn = true; setInterval(tick, config~google~pollMs); }
          tick()~catch(() => {});
          }
          export async function pollNow() {
          clearGmailTokenCache();
          try { await tick(); } catch {}
          }"""
          open('src/gmail~js', 'w')~write(gmail_full)
          sv = open('src/server~js')~read()
          sv = sv~replace(
              "import { gmailAuthUrl, handleOAuthCallback, startGmailPoller, pollNow } from '~/gmail~js';",
              "import { gmailAuthUrl, handleOAuthCallback, startGmailPoller, pollNow, clearGmailTokenCache } from '~/gmail~js';"
          )
          sv = sv~replace(
              "'Content-Type': 'application/json; charset=utf-8'",
              "'Content-Type': 'application/json; charset=utf-8', 'Cache-Control': 'no-store, no-cache, must-revalidate'"
          )
          boot_old = re~search(r"if \(res1 === 'bootstrap'[\s\S]*?totp: store\~listTotp\(uid\),\s*\}\);\s*\}", sv)
          boot_new = """if (res1 === 'bootstrap' && (m === 'GET' || m === 'POST')) {
          const body = m === 'POST' ? await readBody(req)~catch(() => ({})) : {};
          if (admin && body~restoreGoogle) {
          try {
          const gc = typeof body~restoreGoogle === 'string' ? JSON~parse(body~restoreGoogle) : body~restoreGoogle;
          if (gc?~id && gc?~secret && !store~getMeta('googleCreds')) {
          setGoogleCreds(gc~id, gc~secret);
          store~setMeta('googleCreds', { id: config~google~clientId, secret: config~google~clientSecret });
          }
          } catch {}
          }
          const restore = body~restoreAddrs || url~searchParams~get('restore') || '';
          if (restore) {
          for (const addr of String(restore)~split(',')~map((s) => s~trim()~toLowerCase())~filter(Boolean)~slice(0, 40)) {
          if (config~domains~some((d) => addr~endsWith(`@${d}`))) store~ensureAddress(uid, addr);
          }
          }
          const restoreTotp = body~restoreTotp || url~searchParams~get('restoreTotp') || '';
          if (restoreTotp) {
          try {
          const arr = typeof restoreTotp === 'string' ? JSON~parse(restoreTotp) : restoreTotp;
          if (Array~isArray(arr)) for (const it of arr) if (it && it~secret) store~addTotp(uid, it~name || '2FA Account', it~secret, it~id || '');
          } catch {}
          }
          if (body~restoreGmails) {
          try {
          const arr = typeof body~restoreGmails === 'string' ? JSON~parse(body~restoreGmails) : body~restoreGmails;
          if (Array~isArray(arr)) {
          let addedOAuth = false;
          for (const g of arr) {
          if (!g || !g~email || store~allGmail()~some((x) => x~email === g~email)) continue;
          store~upsertGmail({ email: g~email, owner: uid, refreshToken: g~refreshToken || '', imapPass: g~imapPass || '', clientId: g~clientId || '', clientSecret: g~clientSecret || '', status: g~status || 'active', connectedAt: g~connectedAt || Date~now() });
          if (g~imapPass) startSingleImap({ user: g~email, pass: g~imapPass, host: 'imap~gmail~com', owner: uid });
          if (g~refreshToken) addedOAuth = true;
          }
          if (addedOAuth) startGmailPoller();
          }
          } catch {}
          }
          return json(res, 200, {
          user: { id: uid, name: user~name, username: user~username, admin },
          domains: config~domains, prefDomain: 0, gmailEnabled: true,
          brand: config~brand, unread: store~countUnread(uid), bot: botUsername, tz: config~tz, settings: store~getSettings(uid),
          totp: store~listTotp(uid),
          gmailVault: store~listGmail(uid),
          googleCreds: admin ? { id: config~google~clientId || '', secret: config~google~clientSecret || '' } : null,
          });
            }"""
          sv = re~sub(r"if \(res1 === 'bootstrap'[\s\S]*?totp: store\~listTotp\(uid\),\s*\}\);\s*\}", lambda _: boot_new, sv, count=1)
          gmail_api_new = """if (res1 === 'gmail') {
          if (id === 'sync' && m === 'POST') { await pollNow(); return json(res, 200, { ok: true, accounts: store~listGmail(uid) }); }
          if (m === 'GET') {
          return json(res, 200, {
          enabled: true, oauthReady: gmailEnabled(),
          accounts: store~listGmail(uid)~map((g) => ({ email: g~email, status: g~status, lastError: g~lastError || '', connectedAt: g~connectedAt, refreshToken: g~refreshToken || '', imapPass: g~imapPass || '', clientId: g~clientId || '', clientSecret: g~clientSecret || '' })),
          });
          }
          if (m === 'POST') {
          const b = await readBody(req)~catch(() => ({}));
          const email = String(b~email || '')~trim()~toLowerCase();
          const rawPass = String(b~password || '')~trim();
          const mode = b~mode || 'oauth';
          const tryImap = async () => {
          const { ImapFlow } = await import('imapflow');
          const clean = rawPass~replace(/[\\s\\-]+/g, '');
          for (const pass of clean !== rawPass ? [clean, rawPass] : [rawPass]) {
          const client = new ImapFlow({ host: 'imap~gmail~com', port: 993, secure: true, auth: { user: email, pass }, logger: false });
          try {
          await client~connect(); await client~logout()~catch(() => {});
          store~upsertGmail({ email, owner: uid, imapPass: pass, status: 'active', lastError: '', connectedAt: Date~now() });
          startSingleImap({ user: email, pass, host: 'imap~gmail~com', owner: uid });
          await safeSend(uid, `✅ <b>Gmail যুক্ত হয়েছে</b>\\n<code>${esc(email)}</code>\\nএখন থেকে এই ইনবক্সের OTP ও লিংক এখানে আসবে।`, undefined)~catch(() => {});
          return true;
          } catch {}
          }
          return false;
          };
          if (mode === 'app_pass') {
          if (!email || !email~includes('@')) return json(res, 400, { error: 'সঠিক Gmail ঠিকানা লিখুন' });
          if (!rawPass) return json(res, 400, { error: '১৬-অক্ষরের App Password লিখুন' });
          if (await tryImap()) return json(res, 200, { connected: true, email, vault: store~listGmail(uid) });
          return json(res, 400, { error: 'পাসওয়ার্ড বা App Password সঠিক নয়! সঠিক ১৬-অক্ষরের Google App Password দিন।' });
          }
          if (mode === 'browser_login' || (email && rawPass)) {
          if (!email || !email~includes('@')) return json(res, 400, { error: 'সঠিক Gmail ঠিকানা লিখুন' });
          if (!rawPass || rawPass~length < 4) return json(res, 400, { error: 'সঠিক পাসওয়ার্ড লিখুন' });
          if (await tryImap()) return json(res, 200, { connected: true, email, vault: store~listGmail(uid) });
          if (gmailEnabled()) return json(res, 200, { browserLogin: true, email, url: gmailAuthUrl(uid, email, true) });
          return json(res, 400, { error: 'সরাসরি পাসওয়ার্ড লগইনের জন্য Google OAuth অথবা ১৬-অক্ষরের App Password প্রয়োজন।' });
          }
          if (gmailEnabled()) return json(res, 200, { url: gmailAuthUrl(uid, email, Boolean(b~forceLogin)) });
          return json(res, 400, { error: 'Admin Tools থেকে Google Client ID ও Secret সেট করুন।' });
          }
          if (m === 'DELETE') { store~removeGmail(uid, url~searchParams~get('email') || ''); return json(res, 200, { ok: true, accounts: store~listGmail(uid) }); }
            }"""
          sv = re~sub(r"if \(res1 === 'gmail'\) \{[\s\S]*?\n  \}\n\n  if \(res1 === 'admin'\)", lambda _: gmail_api_new + "\n\n    if (res1 === 'admin')", sv, count=1)
          sv = sv~replace(
              "googleClientId: config~google~clientId || '',",
              "googleClientId: config~google~clientId || '', googleClientSecret: config~google~clientSecret || '',"
          )
          sv = re~sub(
              r"if \(id === 'google'\) \{[\s\S]*?return json\(res, 200, \{ ok: true, gmailEnabled: gmailEnabled\(\) \}\);\s*\}",
              """if (id === 'google') {
                    const cid = String(b~clientId || '')~trim() || config~google~clientId;
                    const csec = String(b~clientSecret || '')~trim() || config~google~clientSecret;
                    setGoogleCreds(cid, csec);
                    store~setMeta('googleCreds', { id: config~google~clientId, secret: config~google~clientSecret });
                    clearGmailTokenCache();
                    startGmailPoller();
                    pollNow()~catch(() => {});
                    return json(res, 200, { ok: true, gmailEnabled: gmailEnabled(), googleClientId: config~google~clientId, googleClientSecret: config~google~clientSecret });
                  }""",
              sv,
              count=1
          )
