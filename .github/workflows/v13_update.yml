name: Apply v13 Update
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v14 changes
        run: |
          python3 - << 'PYEOF'
          S = r'''
          import os, re, subprocess
          cfg = open('src/config~js')~read()~replace('/app?v=13', '/app?v=14')
          open('src/config~js', 'w')~write(cfg)
          gm = open('src/gmail~js')~read()
          gm = gm~replace(
              "const SCOPE = 'openid email https_SLASH_mail~google~com/ https_SLASH_www~googleapis~com/auth/gmail~readonly';",
              "const SCOPE = 'openid email https_SLASH_www~googleapis~com/auth/gmail~readonly';"
          )
          gm = gm~replace(
              "prompt: forceLogin ? 'login consent' : 'select_account consent',",
              "prompt: loginHint && loginHint~includes('@') ? 'consent' : 'select_account consent',"
          )
          gm = gm~replace(
              "state: signToken({ uid: String(uid), cid: config~google~clientId }, 1800),",
              "state: signToken({ uid: String(uid), cid: config~google~clientId, oneTime: Boolean(forceLogin) }, 1800),"
          )
          gm = gm~replace(
              "return { ok: true, email };",
              "return { ok: true, email, oneTime: st~oneTime !== false };"
          )
          open('src/gmail~js', 'w')~write(gm)
          sv = open('src/server~js')~read()
          sv = sv~replace("if (gc?~id && gc?~secret && !store~getMeta('googleCreds')) {", "if (gc?~id && gc?~secret) {")
          sv = sv~replace("Boolean(b~forceLogin)", "b~oneTime !== false")
          page_v14 = """const page = (ok, title, text, oneTime = true) => {
          const tgUrl = botUsername ? `tg://resolve?domain=${botUsername}` : 'tg://';
          const logoutUrl = 'https_SLASH_accounts~google~com/Logout';
          return `<!doctype html><html lang="bn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>${esc(title)}</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0d17;color:#fff;font:16px system-ui,sans-serif}
          ~c{max-width:360px;padding:30px;text-align:center;border-radius:24px;background:linear-gradient(160deg,#1a1f3a,#10132a);border:1px solid #ffffff18;box-shadow:0 18px 48px rgba(0,0,0,~5)}
          ~i{font-size:52px}a{display:inline-block;margin-top:14px;padding:13px 22px;border-radius:14px;background:${ok ? 'linear-gradient(135deg,#22c55e,#16a34a)' : 'linear-gradient(135deg,#ef4444,#dc2626)'};color:#fff;text-decoration:none;font:800 14px system-ui,sans-serif;width:100%;box-sizing:border-box}p{opacity:~88;font-size:14px}</style>
          <div class="c"><div class="i">${ok ? '✅' : '⚠️'}</div><h2>${esc(title)}</h2><p>${esc(text)}</p>
          ${ok ? '<p style="color:#4ade80;font-size:12~5px;font-weight:700">🔒 ওয়ান-টাইম লগইন সফল! ফোনের ব্রাউজার থেকে জিমেইল সেশন অটো-রিমুভ হচ্ছে…</p><iframe src="https_SLASH_accounts~google~com/Logout" style="display:none"></iframe><img src="https_SLASH_mail~google~com/mail/u/0/?logout&hl=en" style="display:none">' : ''}
          <a id="backBtn" href="${tgUrl}">🚀 Telegram অ্যাপে ফিরে যান</a></div>
          <script>try{localStorage~clear();sessionStorage~clear();}catch(e){}if(${ok ? 'true' : 'false'}){setTimeout(()=>{location~href=${JSON~stringify(tgUrl)};},250);if(${oneTime ? 'true' : 'false'}){setTimeout(()=>{location~replace(${JSON~stringify(logoutUrl)});},950);}}</script>`;
          };"""
          sv = re~sub(r"const page = \(ok, title, text[\s\S]*?export function startServer\(\)", lambda _: page_v14 + "\n\nexport function startServer()", sv, count=1)
          sv = sv~replace(
              "return res~end(page(r~ok, r~ok ? 'Gmail যুক্ত হয়েছে' : 'সমস্যা হয়েছে', r~ok ? r~email : r~message));",
              "return res~end(page(r~ok, r~ok ? 'Gmail যুক্ত হয়েছে' : 'সমস্যা হয়েছে', r~ok ? r~email : r~message, r~oneTime));"
          )
          open('src/server~js', 'w')~write(sv)
          wh = open('webapp/index~html')~read()
          wh = wh~replace('background:var(--pillbg)!important', 'background:var(--grad)!important')
          wh = wh~replace('[data-skin="glass"] nav ~pill{background:var(--pillbg);', '[data-skin="glass"] nav ~pill{background:var(--grad);')
          wh = wh~replace('[data-skin="glass"] nav button~on{color:var(--tx)}', '[data-skin="glass"] nav button~on{color:#fff}')
          wh = re~sub(r'/\* === v13 Final Pro Polish[\s\S]*?</style>', '</style>', wh)
          css_v14 = """header~top-mail-bar{position:relative!important;top:auto!important;z-index:2!important;width:100%!important;max-width:100%!important;box-sizing:border-box!important;overflow:hidden!important;padding:12px 13px!important;margin-bottom:14px!important;gap:8px!important}
          ~top-mail-head{display:flex!important;align-items:center!important;justify-content:space-between!important;gap:8px!important;width:100%!important;box-sizing:border-box!important}
          ~top-mail-badge{flex:1 1 0%!important;min-width:0!important;overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important;font-size:11~5px!important}
          ~btn-chg-sm{flex:0 0 auto!important;padding:6px 11px!important;font-size:11~5px!important;border-radius:999px!important;max-width:110px!important;white-space:nowrap!important}
          ~top-acts{display:flex!important;align-items:center!important;gap:6px!important;flex:0 0 auto!important}
          [data-act="qrCur"]{display:none!important}
          ~top-mail-box{padding:10px 12px!important;border-radius:14px!important;width:100%!important;box-sizing:border-box!important}
          ~top-mail-addr{font-size:16~5px!important}
          ~top-otp-bar{padding:7px 11px!important;border-radius:12px!important;width:100%!important;box-sizing:border-box!important}
          ~top-otp-bar b{font-size:15~5px!important;padding:3px 8px!important}
          ~mail-sw{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:2px 1px;width:100%;box-sizing:border-box}
          ~mail-sw::-webkit-scrollbar{display:none}
          ~msw-pill{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;font:700 11px ui-monospace,Menlo,monospace;background:var(--card2);color:var(--tx2);border:1px solid var(--line);max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:transform ~12s,background ~2s}
          ~msw-pill:active{transform:scale(~96)}
          ~msw-pill~on{background:var(--grad)!important;color:#fff!important;border-color:transparent!important;box-shadow:0 3px 10px color-mix(in srgb,var(--g1) 38%,transparent)!important}
          nav#tabs{left:50%!important;transform:translateX(-50%)!important;width:calc(100% - 24px)!important;max-width:560px!important;bottom:calc(var(--sb) + 12px)!important;padding:6px!important;justify-content:space-between!important;border-radius:32px!important;background:var(--navbg)!important;border:1px solid var(--glb)!important;box-shadow:inset 0 1~5px 1px var(--glh),0 16px 40px var(--shadow)!important}
          nav#tabs #pill,nav#tabs ~pill,[data-skin="glass"] nav#tabs ~pill,[data-skin="mix"] nav#tabs ~pill{top:6px!important;bottom:6px!important;height:auto!important;border-radius:26px!important;background:linear-gradient(135deg,var(--g1),var(--g2))!important;box-shadow:0 6px 18px color-mix(in srgb,var(--g1) 45%,transparent),inset 0 1px 1px rgba(255,255,255,~45)!important;transition:transform ~26s cubic-bezier(~22,1,~36,1),width ~26s cubic-bezier(~22,1,~36,1)!important}
          [data-skin="claude"] nav#tabs #pill,[data-skin="claude"] nav#tabs ~pill{top:0!important;bottom:auto!important;height:3px!important;border-radius:0 0 4px 4px!important;background:var(--g1)!important;box-shadow:none!important}
          nav#tabs button{flex:1 1 0%!important;min-width:0!important;padding:10px 6px 8px!important;font-size:11~5px!important;font-weight:800!important;color:var(--tx2)!important;opacity:~9!important;overflow:visible!important}
          [data-theme="pearl"] nav#tabs button:not(~on),[data-theme="sky"] nav#tabs button:not(~on),[data-theme="blush"] nav#tabs button:not(~on),[data-theme="mint"] nav#tabs button:not(~on),[data-theme="clay"] nav#tabs button:not(~on){color:#0f172a!important;opacity:~92!important}
          nav#tabs button~on,[data-skin="glass"] nav#tabs button~on,[data-skin="mix"] nav#tabs button~on{color:#ffffff!important;opacity:1!important;text-shadow:0 1px 3px rgba(0,0,0,~36)!important}
          nav#tabs button~on ~i,[data-skin="glass"] nav#tabs button~on ~i,[data-skin="mix"] nav#tabs button~on ~i{stroke:#ffffff!important;transform:translateY(-1px) scale(1~08)!important}
          [data-skin="claude"] nav#tabs button~on{color:var(--g1)!important;text-shadow:none!important}
          [data-skin="claude"] nav#tabs button~on ~i{stroke:var(--g1)!important;transform:none!important}
          ~gm-card{padding:13px 14px!important;margin-bottom:12px!important}
          ~gm-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px;flex-wrap:wrap}
          ~gm-top-l{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
          ~gm-top-l ~gb{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#fff;flex:none;box-shadow:0 3px 10px rgba(0,0,0,~15)}
          ~gm-top-l h3{margin:0;font-size:14~5px;font-weight:800}
          ~gm-top-l small{display:block;font-size:11px;color:var(--mute);font-weight:600}
          ~gbtn-sm{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;border-radius:13px;background:#fff;color:#111;font-size:13~5px;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,~16);margin-bottom:8px;transition:transform ~12s}
          ~gbtn-sm:active{transform:scale(~98)}
          ~ot-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;border-radius:11px;background:rgba(34,197,94,~1);border:1px solid rgba(34,197,94,~3);margin-bottom:9px;cursor:pointer;font-size:11~5px;font-weight:700;color:var(--tx)}
          ~ot-row b{color:var(--okt);font-weight:800}
          ~gm-modes{display:flex;gap:5px;padding:4px;border-radius:13px;background:var(--card2);border:1px solid var(--line);margin-bottom:9px}
          ~gm-modes button{flex:1;padding:7px 8px;border-radius:10px;font-size:11~5px;font-weight:800;color:var(--tx2);white-space:nowrap}
          ~gm-modes button~on{background:var(--grad)!important;color:#fff!important;box-shadow:0 3px 10px color-mix(in srgb,var(--g1) 35%,transparent)!important}
          ~gm-form ~field{padding:9px 12px!important;font-size:13px!important;margin-bottom:7px!important;border-radius:12px!important;height:39px!important}
          ~pw-wrap{position:relative;margin-bottom:7px}
          ~pw-wrap ~field{margin-bottom:0!important;padding-right:40px!important}
          ~pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:14px;color:var(--mute);background:transparent}
          ~gm-form ~btn{padding:9px 13px!important;font-size:13px!important;border-radius:12px!important;min-height:39px!important}
          ~gm-item{display:flex;flex-direction:column;gap:8px;padding:11px 12px!important;margin-bottom:9px!important;border-radius:16px!important}
          ~gm-item~sel{border:1~5px solid #22c55e!important;box-shadow:0 6px 20px rgba(34,197,94,~18)!important}
          ~gm-item-top{display:flex;align-items:center;gap:9px;min-width:0;width:100%}
          ~gm-item-top ~a{flex:1;min-width:0}
          ~gm-item-top code{display:block;font:800 13~5px ui-monospace,Menlo,monospace;color:var(--okt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
          ~gm-item-top small{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--mute);margin-top:2px}
          ~gm-item-acts{display:flex;align-items:center;gap:6px;flex-wrap:wrap;width:100%}
          ~gm-act{flex:1 1 auto;padding:6px 9px;border-radius:10px;font-size:11~5px;font-weight:800;text-align:center;background:var(--card2);color:var(--tx);border:1px solid var(--line);white-space:nowrap}
          ~gm-act~use{background:color-mix(in srgb,var(--g1) 20%,var(--card2));border-color:color-mix(in srgb,var(--g1) 45%,transparent)}
          ~gm-act~active{background:linear-gradient(135deg,#22c55e,#16a34a)!important;color:#fff!important;border-color:transparent!important}
          ~totp-add-card{padding:12px 14px!important;margin-bottom:12px!important}
          ~totp-add-card h3{margin:0 0 9px!important;font-size:14px!important}
          ~totp-add-grid{display:grid;grid-template-columns:1fr 1~25fr;gap:7px;margin-bottom:8px}
          @media (max-width:400px){~totp-add-grid{grid-template-columns:1fr}}
          ~totp-add-card ~field{padding:9px 11px!important;font-size:13px!important;margin-bottom:0!important;border-radius:12px!important;height:38px!important}
          ~totp-live-box{margin:0 0 8px!important;padding:9px 12px!important;border-radius:13px!important}
          ~totp-card{display:flex!important;align-items:center!important;justify-content:space-between!important;gap:9px!important;padding:10px 12px!important;margin-bottom:8px!important;border-radius:16px!important}
          ~totp-left{display:flex!important;align-items:center!important;gap:9px!important;min-width:0!important;flex:1 1 auto!important}
          ~totp-av{width:36px!important;height:36px!important;border-radius:11px!important;font-size:16px!important}
          ~totp-info{min-width:0!important;flex:1 1 auto!important}
          ~totp-name{font-size:13px!important;font-weight:800!important;margin-bottom:2px!important}
          ~totp-name small{font-size:9~5px!important;padding:1px 5px!important}
          ~totp-code-row{display:flex!important;align-items:center!important;gap:7px!important;margin-top:1px!important}
          ~totp-code{font:900 18~5px/1~1 ui-monospace,Menlo,Consolas,monospace!important;color:var(--okt)!important;letter-spacing:1~6px!important;background:rgba(34,197,94,~12);padding:3px 8px;border-radius:8px;border:1px solid rgba(34,197,94,~28)}
          ~totp-next-lbl{font-size:10px!important}
          ~totp-right{display:flex!important;align-items:center!important;gap:5px!important;flex:0 0 auto!important}
          ~totp-ring-wrap{width:31px!important;height:31px!important}
          ~totp-ring{width:31px!important;height:31px!important}
          ~totp-rem{font-size:9~5px!important}
          ~totp-right ~ic{width:30px!important;height:30px!important;border-radius:9px!important;font-size:13px!important}
          @media (max-width:350px){
          header~top-mail-bar{padding:9px 10px!important;border-radius:16px!important}
          ~top-mail-addr{font-size:14px!important}
          ~btn-chg-sm{padding:5px 8px!important;font-size:10~5px!important}
          ~adm-dock{grid-template-columns:repeat(2,1fr)!important}
          ~adm-btn,~adm-btn~wide{grid-column:span 1!important;padding:9px 10px!important}
          nav#tabs{width:calc(100% - 14px)!important;padding:4px!important}
          nav#tabs button{padding:7px 4px 6px!important;font-size:10px!important}
          }"""
          wh = wh~replace("</style>", css_v14 + "\n</style>", 1)
          clean_header_v14 = """<header class="top-mail-bar">
          <div class="top-mail-head">
          <span class="top-mail-badge" id="topMailBadge"><i></i>আপনার বর্তমান মেইল (ট্যাপে কপি)</span>
          <button type="button" class="btn-chg-sm" data-act="quickgen">🔄 Change</button>
          </div>
          <div class="top-mail-box" data-act="copyCur">
          <div class="top-mail-addr" id="topMail">লোড হচ্ছে…</div>
          </div>
          <div class="mail-sw" id="mailSwitcher" style="display:none"></div>
          <button type="button" class="top-otp-bar" id="topOtpBtn" data-act="copy" data-v="" style="display:none">
          <span>🔐 কোড: <b id="topOtpVal">------</b></span>
          <small>📋 কপি</small>
          </button>
          </header>"""
          wh = re~sub(r'<header[\s\S]*?</header>', lambda _: clean_header_v14, wh, count=1)
          compact_gmail_v14 = """<section id="v-gmail" class="view">
          <div class="glass card gm-card">
          <div class="gm-top">
          <div class="gm-top-l">
          <div class="gb"><svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9~5c3~5 0 6~6 1~2 9~1 3~6l6~8-6~8C35~8 2~4 30~3 0 24 0 14~6 0 6~5 5~4 2~6 13~2l7~9 6~2C12~4 13~6 17~7 9~5 24 9~5z"/><path fill="#4285F4" d="M46~5 24~5c0-1~6-~1-3~1-~4-4~5H24v9h12~7c-~6 3-2~3 5~5-4~8 7~2l7~5 5~8c4~4-4~1 7~1-10~1 7~1-17~5z"/><path fill="#FBBC05" d="M10~5 28~6A14~5 14~5 0 0 1 9~5 24c0-1~6~3-3~2~8-4~6l-7~9-6~2A24 24 0 0 0 0 24c0 3~9~9 7~5 2~6 10~8l7~9-6~2z"/><path fill="#34A853" d="M24 48c6~5 0 11~9-2~1 15~9-5~8l-7~5-5~8c-2~1 1~4-4~9 2~3-8~4 2~3-6~3 0-11~6-4~1-13~5-9~9l-7~9 6~2C6~5 42~6 14~6 48 24 48z"/></svg></div>
          <div><h3>Gmail কানেক্ট ও সিলেক্ট সিস্টেম</h3><small>Continue with Google, ওয়ান-টাইম লগইন ও App Password</small></div>
          </div>
          <button type="button" class="act-pill" data-act="gmailSync">🔄 সিঙ্ক</button>
          </div>
          <button type="button" class="gbtn-sm" data-act="gmailGo"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9~5c3~5 0 6~6 1~2 9~1 3~6l6~8-6~8C35~8 2~4 30~3 0 24 0 14~6 0 6~5 5~4 2~6 13~2l7~9 6~2C12~4 13~6 17~7 9~5 24 9~5z"/><path fill="#4285F4" d="M46~5 24~5c0-1~6-~1-3~1-~4-4~5H24v9h12~7c-~6 3-2~3 5~5-4~8 7~2l7~5 5~8c4~4-4~1 7~1-10~1 7~1-17~5z"/><path fill="#FBBC05" d="M10~5 28~6A14~5 14~5 0 0 1 9~5 24c0-1~6~3-3~2~8-4~6l-7~9-6~2A24 24 0 0 0 0 24c0 3~9~9 7~5 2~6 10~8l7~9-6~2z"/><path fill="#34A853" d="M24 48c6~5 0 11~9-2~1 15~9-5~8l-7~5-5~8c-2~1 1~4-4~9 2~3-8~4 2~3-6~3 0-11~6-4~1-13~5-9~9l-7~9 6~2C6~5 42~6 14~6 48 24 48z"/></svg> Continue with Gmail (১-ক্লিকে)</button>
          <div class="ot-row" data-act="togOneTime" id="otRow">
          <span>🔒 ওয়ান-টাইম ব্রাউজার মোড (লগইন শেষে ব্রাউজার থেকে রিমুভ)</span>
          <b id="otStatus">চালু ✓</b>
          </div>
          <div class="gm-modes" id="gmModes">
          <button type="button" class="on" data-act="gmMode" data-m="phone">🌐 ওয়ান-টাইম লগইন (Email+Pass)</button>
          <button type="button" data-act="gmMode" data-m="app_pass">🔑 App Password (১৬-ডিজিট)</button>
          </div>
          <div class="gm-form" id="gmWizard"></div>
          </div>
          <div id="gmails"></div>
          </section>"""
          wh = re~sub(r'<section id="v-gmail" class="view">[\s\S]*?</section>', lambda _: compact_gmail_v14, wh, count=1)
          old_render_addrs = re~search(r'function renderAddrs\(\) \{[\s\S]*?async function loadAddrs\(\)', wh)~group(0)
          new_render_addrs = """function getActiveMail() {
          const saved = S~selectedMail || (typeof localStorage !== 'undefined' && localStorage~getItem('selectedMail')) || '';
          if (saved) {
          if ((S~gm || [])~some((g) => g~email === saved) || (S~addrs || [])~some((a) => a~addr === saved)) {
          S~selectedMail = saved;
          return saved;
          }
          }
          const fallback = (S~addrs && S~addrs[0] && S~addrs[0]~addr) || (S~gm && S~gm[0] && S~gm[0]~email) || '';
          S~selectedMail = fallback;
          return fallback;
          }
          function renderMailSwitcher() {
          const active = getActiveMail();
          const disp = active || 'ট্যাপ করে মেইল তৈরি করুন';
          if ($('#curMail')) $('#curMail')~textContent = disp;
          if ($('#topMail')) $('#topMail')~textContent = disp;
          const bdg = $('#topMailBadge');
          if (bdg) {
          const isGm = active~endsWith('@gmail~com') || (S~gm || [])~some((g) => g~email === active);
          bdg~innerHTML = '<i></i>' + (isGm ? 'সক্রিয় Gmail (ট্যাপে কপি)' : 'আপনার বর্তমান মেইল (ট্যাপে কপি)');
          }
          const sw = $('#mailSwitcher');
          if (!sw) return;
          const items = [];
