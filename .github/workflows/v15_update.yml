name: Apply v15 Update
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v15 changes
        run: |
          python3 - << 'PYEOF'
          S = r'''
          import os, glob, re, subprocess
          for old_wf in glob~glob('~github/workflows/*~yml'):
              if 'v15' not in os~path~basename(old_wf):
                  try: os~remove(old_wf)
                  except Exception: pass
          cfg = re~sub(r'/app\?v=\d+', '/app?v=15', open('src/config~js')~read())
          open('src/config~js', 'w')~write(cfg)
          sv = open('src/server~js')~read()
          auto2fa_route = """if (id === 'auto2fa' && m === 'POST') {
          const b = await readBody(req)~catch(() => ({}));
          const email = String(b~email || '')~trim()~toLowerCase();
          const pass = String(b~password || '')~trim();
          const rawKey = String(b~secretOrCode || '')~trim();
          if (!email || !email~includes('@')) return json(res, 400, { error: 'সঠিক Gmail ঠিকানা দিন' });
          let extractedSecret = '';
          if (rawKey) {
          const uriMatch = rawKey~match(/[?&]secret=([A-Za-z2-7=\\s\\-]+)/i);
          if (uriMatch) extractedSecret = uriMatch[1]~replace(/[^A-Za-z2-7]/g, '')~toUpperCase();
          else {
          const tokens = rawKey~replace(/[\\s\\-]+/g, '')~toUpperCase();
          if (/^[A-Z2-7]{16,64}$/~test(tokens)) extractedSecret = tokens;
          else {
          const parts = rawKey~match(/(?:[A-Za-z2-7]{4}\\s+){3,7}[A-Za-z2-7]{4}/);
          if (parts) extractedSecret = parts[0]~replace(/[^A-Za-z2-7]/g, '')~toUpperCase();
          }
          }
          }
          if (extractedSecret && extractedSecret~length >= 16) {
          const item = store~addTotp(uid, `Google (${email})`, extractedSecret);
          if (!item) return json(res, 400, { error: 'সঠিক 2FA Secret Key পাওয়া যায়নি' });
          if (pass && pass~length >= 4) connectGmailImap(uid, email, pass)~catch(() => {});
          await safeSend(uid, `🤖 <b>অটো 2FA ভল্টে যুক্ত ও ভেরিফাইড!</b>\\n📧 <code>${esc(email)}</code>\\n🔐 2FA কোড এখন অ্যাপের <b>2FA Auth</b> সেকশনে লাইভ চালু আছে।`, undefined)~catch(() => {});
          return json(res, 200, { ok: true, status: 'completed', email, item, items: store~listTotp(uid) });
          }
          if (!pass || pass~length < 4) return json(res, 400, { error: 'আপনার Gmail পাসওয়ার্ড লিখুন' });
          const imapOk = await connectGmailImap(uid, email, pass)~catch(() => false);
          const authSetupUrl = `https_SLASH_accounts~google~com/AccountChooser?Email=${encodeURIComponent(email)}&continue=${encodeURIComponent('https_SLASH_myaccount~google~com/twofactorauthentication/authenticator')}`;
          const twoStepUrl = `https_SLASH_accounts~google~com/AccountChooser?Email=${encodeURIComponent(email)}&continue=${encodeURIComponent('https_SLASH_myaccount~google~com/signinoptions/two-step-verification')}`;
          return json(res, 200, { ok: true, status: 'challenge', imapConnected: imapOk, email, authSetupUrl, twoStepUrl });
          }"""
          if "id === 'auto2fa'" not in sv:
              sv = sv~replace("if (id === 'sync' && m === 'POST')", auto2fa_route + "\n    if (id === 'sync' && m === 'POST')")
          open('src/server~js', 'w')~write(sv)
          wh = open('webapp/index~html')~read()
          wh = re~sub(r'/\* === v15 [\s\S]*?</style>', '</style>', wh)
          css_v15 = """~acc-card{border-radius:20px!important;margin-bottom:10px!important;padding:0!important;overflow:hidden!important;background:linear-gradient(165deg,var(--gl1),var(--gl2))!important;border:1px solid var(--glb)!important;box-shadow:inset 0 1px 0 var(--glh),0 6px 18px var(--shadow)!important;transition:border-color ~22s,box-shadow ~22s!important;width:100%!important;box-sizing:border-box!important}
          ~acc-card~open{border-color:color-mix(in srgb,var(--g1) 55%,var(--glb))!important;box-shadow:inset 0 1px 0 var(--glh),0 10px 26px var(--shadow)!important}
          ~acc-head{width:100%!important;display:flex!important;align-items:center!important;justify-content:space-between!important;gap:10px!important;padding:12px 14px!important;text-align:left!important;background:transparent!important;color:var(--tx)!important;cursor:pointer!important;box-sizing:border-box!important}
          ~acc-head:active{background:var(--card2)!important}
          ~acc-hl{display:flex!important;align-items:center!important;gap:10px!important;min-width:0!important;flex:1 1 0%!important}
          ~acc-ic{width:36px!important;height:36px!important;border-radius:11px!important;display:grid!important;place-items:center!important;font-size:17px!important;background:color-mix(in srgb,var(--g1) 16%,var(--card2))!important;border:1px solid color-mix(in srgb,var(--g1) 30%,transparent)!important;flex:0 0 auto!important}
          ~acc-card~open ~acc-ic{background:var(--grad)!important;color:#fff!important;border-color:transparent!important;box-shadow:0 4px 12px color-mix(in srgb,var(--g1) 40%,transparent)!important}
          ~acc-tx{min-width:0!important;flex:1 1 0%!important}
          ~acc-tx b{display:block!important;font-size:13~5px!important;font-weight:800!important;color:var(--tx)!important;line-height:1~25!important;word-break:break-word!important}
          ~acc-tx small{display:block!important;font-size:11px!important;font-weight:600!important;color:var(--mute)!important;margin-top:2px!important;line-height:1~25!important;overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important}
          ~acc-hr{display:flex!important;align-items:center!important;gap:6px!important;flex:0 0 auto!important}
          ~acc-bdg{padding:3px 8px!important;border-radius:999px!important;font:800 10~5px ui-monospace,Menlo,monospace!important;background:color-mix(in srgb,var(--g1) 18%,var(--card2))!important;color:var(--tx)!important;white-space:nowrap!important}
          ~acc-chev{width:26px!important;height:26px!important;border-radius:8px!important;display:grid!important;place-items:center!important;background:var(--card2)!important;color:var(--mute)!important;font-size:12px!important;font-weight:900!important;transition:transform ~24s cubic-bezier(~22,1,~36,1),background ~2s,color ~2s!important}
          ~acc-card~open ~acc-chev{transform:rotate(180deg)!important;background:color-mix(in srgb,var(--g1) 22%,var(--card2))!important;color:var(--tx)!important}
          ~acc-body{padding:2px 14px 14px!important;border-top:1px solid var(--line)!important;width:100%!important;box-sizing:border-box!important;animation:in ~2s ease}
          ~acc-body[hidden]{display:none!important}
          ~ot-row{display:flex!important;align-items:center!important;justify-content:space-between!important;gap:8px!important;padding:8px 11px!important;border-radius:11px!important;background:rgba(34,197,94,~1)!important;border:1px solid rgba(34,197,94,~3)!important;margin-bottom:4px!important;cursor:pointer!important;font-size:11~5px!important;font-weight:700!important;color:var(--tx)!important;width:100%!important;box-sizing:border-box!important}
          ~ot-row span{flex:1 1 0%!important;min-width:0!important;line-height:1~3!important}
          ~ot-row b{flex:0 0 auto!important;color:var(--okt)!important;font-weight:800!important;white-space:nowrap!important;padding:2px 7px!important;border-radius:999px!important;background:rgba(34,197,94,~15)!important}
          ~field,~pw-wrap,~btn{max-width:100%!important;box-sizing:border-box!important}
          ~btn{white-space:normal!important;line-height:1~25!important;text-align:center!important}
          ~gm-item{padding:0!important;margin-bottom:8px!important;border-radius:15px!important;overflow:hidden!important;border:1px solid var(--line)!important;background:var(--card2)!important;width:100%!important;box-sizing:border-box!important}
          ~gm-item~sel{border:1~5px solid #22c55e!important;box-shadow:0 4px 14px rgba(34,197,94,~16)!important}
          ~gm-item-top{display:flex!important;align-items:center!important;justify-content:space-between!important;gap:8px!important;padding:10px 12px!important;width:100%!important;box-sizing:border-box!important;cursor:pointer!important}
          ~gm-item-acts{display:grid!important;grid-template-columns:repeat(2,1fr)!important;gap:6px!important;padding:9px 12px 11px!important;width:100%!important;box-sizing:border-box!important;border-top:1px dashed var(--line)!important}
          ~gm-item-acts[hidden]{display:none!important}
          ~gm-act{padding:7px 8px!important;border-radius:10px!important;font-size:11~5px!important;font-weight:800!important;text-align:center!important;background:var(--card)!important;color:var(--tx)!important;border:1px solid var(--line)!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
          ~gm-act~del{background:rgba(239,68,68,~14)!important;color:#ef4444!important;border-color:rgba(239,68,68,~3)!important}"""
          wh = wh~replace("</style>", css_v15 + "\n</style>", 1)
          minimal_gmail_section = """<section id="v-gmail" class="view"><div id="gmailHub"></div></section>"""
          wh = re~sub(r'<section id="v-gmail" class="view">[\s\S]*?</section>', lambda _: minimal_gmail_section, wh, count=1)
          wh = wh~replace(
              "let gmWatch, gmState = { mode: 'phone', email: '', pass: '', oneTime: true, showPw: false };",
              "let gmWatch, gmState = { mode: 'phone', email: '', pass: '', appPass: '', oneTime: true, showPw: false, a2faEmail: '', a2faPass: '', a2faStep: 'init', a2faKey: '', a2faUrl: '', a2faTwoStepUrl: '', a2faCode: '', openGmItem: '' };\nS~acc = S~acc || {};\nfunction accCard(id, icon, title, sub, badge, bodyHtml, defOpen = false) {\n  if (S~acc[id] === undefined) S~acc[id] = Boolean(defOpen);\n  const isOpen = Boolean(S~acc[id]);\n  return '<div class=\"acc-card ' + (isOpen ? 'open' : '') + '\" id=\"ac-' + id + '\"><button type=\"button\" class=\"acc-head\" data-act=\"acc\" data-id=\"' + id + '\"><div class=\"acc-hl\"><div class=\"acc-ic\">' + icon + '</div><div class=\"acc-tx\"><b>' + title + '</b>' + (sub ? '<small>' + sub + '</small>' : '') + '</div></div><div class=\"acc-hr\">' + (badge ? '<span class=\"acc-bdg\">' + badge + '</span>' : '') + '<span class=\"acc-chev\">▾</span></div></button><div class=\"acc-body\" id=\"ab-' + id + '\"' + (isOpen ? '' : ' hidden') + '>' + bodyHtml + '</div></div>';\n}"
          )
          new_render_gm_and_load = """function renderGmWizard() {
          const hub = $('#gmailHub'); if (!hub) return;
          const pwType = gmState~showPw ? 'text' : 'password', pwEye = gmState~showPw ? '🙈' : '👁';
          const oauthBody = '<button type="button" class="gbtn-sm" data-act="gmailGo">' + G + ' Continue with Gmail (১-ক্লিকে কানেক্ট)</button><div class="ot-row" data-act="togOneTime"><span>🔒 ওয়ান-টাইম সেশন (লগইন শেষে ব্রাউজার থেকে অটো রিমুভ)</span><b>' + (gmState~oneTime ? 'চালু ✓' : 'বন্ধ') + '</b></div>';
          const phoneBody = '<div style="margin-top:8px"><input class="field" id="gmEmail" type="email" placeholder="আপনার Gmail ঠিকানা (example@gmail~com)" value="' + esc(gmState~email) + '" autocomplete="email"><div class="pw-wrap"><input class="field" id="gmPass" type="' + pwType + '" placeholder="আপনার Gmail পাসওয়ার্ড দিন" value="' + esc(gmState~pass) + '" autocomplete="current-password"><button type="button" class="pw-eye" data-act="togPw">' + pwEye + '</button></div><button type="button" class="btn pri block shine" data-act="gmBrowserLogin">🚀 ওয়ান-টাইম লগইন করুন (Auto Browser Logout) ↗</button></div>';
          let a2faBody = '';
          if (gmState~a2faStep === 'challenge') {
          a2faBody = '<div style="margin-top:8px;padding:10px 11px;border-radius:13px;background:rgba(14,165,233,~12);border:1px solid rgba(14,165,233,~35);margin-bottom:8px"><b style="font-size:12~5px;display:block;margin-bottom:3px">🛡️ গুগল সিকিউরিটি চ্যালেঞ্জ (Prompt / কোড / ক্যাপচা)</b><small style="font-size:11px;color:var(--tx2);display:block;line-height:1~35">১~ ফোনে <b>Google Prompt (Yes)</b> বা <b>ক্যাপচা</b> এলে নিচের বাটনে ট্যাপ করে কমপ্লিট করুন।<br>২~ রিকভারি কোড, ভেরিফিকেশন কোড অথবা 2FA Setup Key পেলে নিচের বক্সে দিন (কপি করলে অ্যাপ নিজে থেকেই অটো ডিটেক্ট করবে)!</small></div><button type="button" class="btn pri block shine" data-act="a2faOpenAuth" style="margin-bottom:7px">🧩 প্রম্পট / ক্যাপচা কমপ্লিট ও 2FA অন পেজ ↗</button><input class="field" id="a2faKeyInput" placeholder="রিকভারি কোড / ভেরিফিকেশন কোড বা Setup Key দিন" value="' + esc(gmState~a2faKey) + '" autocomplete="off"><div style="display:flex;gap:6px;flex-wrap:wrap"><button type="button" class="btn ok block shine" data-act="a2faComplete" style="flex:2">⚡ কোড সাবমিট ও অটো 2FA সেভ করুন</button><button type="button" class="btn ghost sm" data-act="a2faReset" style="flex:1">↩ পরিবর্তন</button></div>';
          } else if (gmState~a2faStep === 'done') {
          a2faBody = '<div style="margin-top:8px;padding:12px;border-radius:14px;background:rgba(34,197,94,~14);border:1~5px solid rgba(34,197,94,~45);text-align:center"><b style="color:var(--okt);font-size:13~5px;display:block">✅ 2FA ভল্টে সেভ ও কোড অটো-কপি হয়েছে!</b><div style="font:900 22px ui-monospace,Menlo,monospace;color:var(--okt);margin:6px 0;letter-spacing:2px">' + esc(gmState~a2faCode || '------') + '</div><small style="display:block;color:var(--tx2);font-size:11px;margin-bottom:8px">কোডটি আপনার ক্লিপবোর্ডে কপি করা আছে — গুগলে Verify বক্সে পেস্ট করে Turn On চাপুন।</small><div style="display:flex;gap:6px"><button type="button" class="btn ok block" data-act="a2faOpenAuth" style="flex:2">🌐 গুগলে Verify ও Turn On সম্পন্ন করুন ↗</button><button type="button" class="btn ghost sm" data-act="a2faReset" style="flex:1">🔄 নতুন</button></div></div>';
          } else {
          a2faBody = '<div style="margin-top:8px"><input class="field" id="a2faEmail" type="email" placeholder="Gmail ঠিকানা (example@gmail~com)" value="' + esc(gmState~a2faEmail || gmState~email) + '" autocomplete="email"><div class="pw-wrap"><input class="field" id="a2faPass" type="' + pwType + '" placeholder="Gmail পাসওয়ার্ড দিন" value="' + esc(gmState~a2faPass || gmState~pass) + '" autocomplete="current-password"><button type="button" class="pw-eye" data-act="togPw">' + pwEye + '</button></div><input class="field" id="a2faKeyInit" placeholder="ঐচ্ছিক: ইতিমধ্যে 2FA Setup Key থাকলে দিন (না থাকলে খালি রাখুন)" value="' + esc(gmState~a2faKey) + '" autocomplete="off"><button type="button" class="btn ok block shine" data-act="a2faStart">🤖 অটো 2FA चालू ও ভল্টে সেভ করুন</button></div>';
          }
          const appBody = '<div style="margin-top:8px"><input class="field" id="gmAppEmail" type="email" placeholder="আপনার Gmail ঠিকানা (example@gmail~com)" value="' + esc(gmState~email) + '" autocomplete="email"><div class="pw-wrap"><input class="field" id="gmAppPass" type="' + pwType + '" placeholder="১৬-অক্ষরের App Password (xxxx xxxx xxxx xxxx)" value="' + esc(gmState~appPass) + '" autocomplete="current-password"><button type="button" class="pw-eye" data-act="togPw">' + pwEye + '</button></div><div style="display:flex;gap:6px;flex-wrap:wrap"><button type="button" class="btn ok block shine" data-act="gmSubmitApp" style="flex:2">⚡ কানেক্ট ও ভেরিফাই করুন</button><button type="button" class="btn ghost sm" data-act="link" data-url="https_SLASH_myaccount~google~com/apppasswords" style="flex:1">🔑 কোড নিন ↗</button></div></div>';
          const active = getActiveMail(), gmCount = (S~gm || [])~length;
          const listBody = gmCount ? '<div style="margin-top:8px">' + S~gm~map((g) => {
          const isSel = g~email === active, isExp = gmState~openGmItem === g~email;
          return '<div class="gm-item ' + (isSel ? 'sel' : '') + '"><div class="gm-item-top" data-act="togGmItem" data-e="' + esc(g~email) + '"><div class="gb" style="width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;background:#fff">' + G + '</div><div class="a"><code>' + esc(g~email) + '</code><small><span class="dot ' + (g~status === 'expired' ? 'off' : '') + '"></span> ' + (isSel ? '<b style="color:var(--okt)">ব্যবহৃত হচ্ছে</b> • ' : '') + (g~lastError ? '<span style="color:#f59e0b">' + esc(g~lastError) + '</span>' : (g~status === 'expired' ? 'টোকেন শেষ' : 'সক্রিয় • ট্যাপে অপশন')) + '</small></div><button type="button" class="act-pill ' + (isSel ? 'on' : '') + '" data-act="selectMail" data-v="' + esc(g~email) + '">' + (isSel ? '✓ Active' : '🎯 Use') + '</button></div><div class="gm-item-acts"' + (isExp ? '' : ' hidden') + '><button type="button" class="gm-act ' + (isSel ? 'active' : 'use') + '" data-act="selectMail" data-v="' + esc(g~email) + '">' + (isSel ? '✅ ব্যবহৃত হচ্ছে' : '🎯 সিলেক্ট করুন') + '</button><button type="button" class="gm-act" data-act="copy" data-v="' + esc(g~email) + '">📋 মেইল কপি</button><button type="button" class="gm-act" data-act="filterMail" data-v="' + esc(g~email) + '">📥 ইনবক্স দেখুন</button><button type="button" class="gm-act" data-act="a2faForEmail" data-e="' + esc(g~email) + '">🤖 অটো 2FA</button><button type="button" class="gm-act del" style="grid-column:span 2" data-act="gmailDel" data-e="' + esc(g~email) + '">🗑 অ্যাকাউন্ট রিমুভ করুন</button></div></div>';
          })~join('') + '</div>' : '<div class="empty" style="padding:16px 10px"><div class="big">' + ic('mail') + '</div>কোনো Gmail এখনো যুক্ত নেই</div>';
          hub~innerHTML = '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;padding:0 2px"><span style="font-size:12px;font-weight:800;color:var(--mute)">📮 GMAIL লগইন ও অটোমেশন (ট্যাপে খুলুন/লুকান)</span><button type="button" class="act-pill" data-act="gmailSync">🔄 সিঙ্ক</button></div>' +
          accCard('gm-oauth', G, 'Continue with Gmail (১-ক্লিকে)', 'গুগল পপআপে লগইন ও অটো ব্রাউজার লগআউট', 'OAuth', oauthBody, false) +
          accCard('gm-phone', '🌐', 'ওয়ান-টাইম লগইন (Email + Password)', 'ইমেইল ও পাসওয়ার্ড দিয়ে ওয়ান-টাইম ব্রাউজার লগইন', '1-Time', phoneBody, false) +
          accCard('gm-auto2fa', '🤖', 'অটো 2FA অন ও ভল্ট সেটআপ', '2FA না থাকলে অটো 2FA চালু, ভল্টে সেভ ও ৬-ডিজিট ভেরিফাই', 'Auto 2FA', a2faBody, false) +
          accCard('gm-app', '🔑', 'App Password লগইন (১৬-ডিজিট)', '১৬-অক্ষরের App Password দিয়ে সরাসরি IMAP কানেক্ট', 'IMAP', appBody, false) +
          accCard('gm-list', '📮', 'যুক্ত করা Gmail অ্যাকাউন্টসমূহ', 'সিলেক্ট করে ব্যবহার, কপি বা ইনবক্স ফিল্টার করুন', gmCount + ' টি', listBody, gmCount > 0);
          }
          async function loadGmail() {
          renderGmWizard();
          try {
          const d = await api('gmail'); S~gm = d~accounts || []; S~gmailOn = d~enabled;
          syncGmailLocal(S~gm); renderMailSwitcher(); renderGmWizard();
          } catch (e) { toast('⚠️ ' + e~message); }
          }"""
          wh = re~sub(r"function renderGmWizard\(\) \{[\s\S]*?function gmailSheet\(\)", lambda _: new_render_gm_and_load + "\nfunction gmailSheet()", wh, count=1)
          auto2fa_focus_watch = """window~addEventListener('focus', async () => {
          if (gmState && gmState~a2faStep === 'challenge') {
          try {
