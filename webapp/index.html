  <script type="module" src="/app/app.js?v=21"></script><script>(()=>{const sync=()=>{const a=document.getElementById("heroAddrCode"),d=document.getElementById("heroDomainLabel");if(a&&d){const s=(a.textContent||"").trim(),m=s.includes("@")?s.split("@")[1]:"";if(m&&(d.textContent==="undefined"||d.textContent==="Auto-Random"))d.textContent=m+" · 🎲 Auto"}const c=document.getElementById("heroCopyBtn");if(c&&!document.getElementById("v19DomBar")){const b=document.createElement("div");b.id="v19DomBar";b.className="v19-dom-bar";b.innerHTML='<button type="button" class="v19-dom-pill on" data-v19-dom="random">🎲 Auto Random</button><button type="button" class="v19-dom-pill" data-v19-dom="safix.tech">⚡ @safix.tech</button><button type="button" class="v19-dom-pill" data-v19-dom="mdsafiislam.tech">🌐 @mdsafiislam.tech</button>';c.insertAdjacentElement("afterend",b);b.addEventListener("click",async e=>{const t=e.target.closest("[data-v19-dom]");if(!t)return;b.querySelectorAll(".v19-dom-pill").forEach(x=>x.classList.toggle("on",x===t));const dom=t.getAttribute("data-v19-dom"),init=window.Telegram?.WebApp?.initData||"";try{await fetch("/api/domain",{method:"POST",headers:{"Content-Type":"application/json","x-telegram-init-data":init},body:JSON.stringify({domain:dom==="random"?-1:dom})})}catch{}const q=document.querySelector('[data-act="quickGen"]');if(q)q.click()})}};window.addEventListener("DOMContentLoaded",()=>{sync();new MutationObserver(sync).observe(document.body,{childList:true,subtree:true})})})();</script>
