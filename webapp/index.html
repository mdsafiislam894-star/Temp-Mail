<!doctype html>
<html lang="bn" data-theme="aurora" data-skin="glass">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>ARIYAN MAIL</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    try {
      const s = JSON.parse(localStorage.getItem('savedSettings') || '{}');
      if (s.theme) document.documentElement.setAttribute('data-theme', s.theme);
      if (s.skin) document.documentElement.setAttribute('data-skin', s.skin);
      if (s.liteBlur) document.documentElement.setAttribute('data-lite', '1');
    } catch {}
  </script>
  <link rel="stylesheet" href="/app/styles.css?v=5">
</head>
<body>
  <div id="auroraBg" class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
  <!-- Crisp Lucide-style SVG Icon Sprite -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-inbox" viewBox="0 0 24 24"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></symbol>
      <symbol id="i-layers" viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></symbol>
      <symbol id="i-crown" viewBox="0 0 24 24"><path d="m2 4 3 12h14l3-12-6 7-4-7-4 7-6-7zm3 16h14"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
      <symbol id="i-qr" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM19 14h2v2h-2zM14 19h2v2h-2zM19 19h2v2h-2z"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></symbol>
      <symbol id="i-key" viewBox="0 0 24 24"><path d="m21 2-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3m-3.5 3.5L19 4"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></symbol>
      <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></symbol>
      <symbol id="i-bolt" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
      <symbol id="i-camera" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></symbol>
    </defs>
  </svg>

  <!-- Strict Telegram Mini App Gate -->
  <section id="tgGate" class="tg-gate" hidden>
    <div class="gate-card">
      <div class="gate-mark"><svg class="ic ic-lg"><use href="#i-lock"/></svg></div>
      <h1>Telegram Mini App Only</h1>
      <p>নিরাপত্তার জন্য এই অ্যাপটি শুধু আপনার Telegram বটের ভেতর থেকেই চালানো যায়। অনুগ্রহ করে Telegram অ্যাপ থেকে বট ওপেন করে Mini App চালু করুন।</p>
      <div id="gateBotLink"></div>
    </div>
  </section>

  <!-- Main Mini App Shell -->
  <div id="appShell" class="app-shell" hidden>
    <header class="topbar">
      <div class="brand">
        <div class="brand-logo" id="brandLogo">A</div>
        <div class="brand-title">
          <strong id="brandName">ARIYAN MAIL</strong>
          <span class="live-pill"><i class="live-dot" id="liveDot"></i><span id="liveLabel">Connecting</span></span>
        </div>
      </div>
      <div class="top-actions">
        <button type="button" class="btn sm" data-act="goTab" data-tab="totp" aria-label="2FA Vault">
          <svg class="ic ic-sm"><use href="#i-shield"/></svg>
          <span>2FA</span>
        </button>
        <button type="button" class="icon-btn" id="btnTestMail" data-act="testmail" title="টেস্ট OTP">
          <svg class="ic ic-sm"><use href="#i-bolt"/></svg>
        </button>
        <button type="button" class="icon-btn" id="btnTopRefresh" data-act="refresh" title="রিফ্রেশ">
          <svg class="ic ic-sm"><use href="#i-refresh"/></svg>
        </button>
      </div>
    </header>

    <main id="viewRoot"></main>
  </div>

  <!-- Floating Smart OTP Auto-Copy Dock -->
  <div id="otpDock" class="otp-dock" hidden></div>

  <!-- Bottom Navigation -->
  <nav id="bottomNav" class="bottom-nav" hidden>
    <i class="nav-pill" id="navPill" aria-hidden="true"></i>
    <button type="button" class="nav-item on" data-act="goTab" data-tab="inbox">
      <svg class="ic"><use href="#i-inbox"/></svg>
      <span>ইনবক্স</span>
      <span class="nav-badge" id="navUnread" hidden>0</span>
    </button>
    <button type="button" class="nav-item" data-act="goTab" data-tab="totp">
      <svg class="ic"><use href="#i-shield"/></svg>
      <span>2FA ভল্ট</span>
    </button>
    <button type="button" class="nav-item" data-act="goTab" data-tab="hub">
      <svg class="ic"><use href="#i-layers"/></svg>
      <span>হাব</span>
    </button>
    <button type="button" class="nav-item" data-act="goTab" data-tab="settings">
      <svg class="ic"><use href="#i-sliders"/></svg>
      <span>সেটিংস</span>
    </button>
    <button type="button" class="nav-item" id="navAdmin" data-act="goTab" data-tab="admin" hidden>
      <svg class="ic"><use href="#i-crown"/></svg>
      <span>অ্যাডমিন</span>
    </button>
  </nav>

  <div id="sheetRoot"></div>
  <div id="toastRoot"></div>

  <script type="module" src="/app/app.js?v=5"></script>
</body>
</html>
